<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>复盘</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007AFF">
<link rel="apple-touch-icon" href="./android-chrome-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="复盘">
<style>
/* ============================================================
   全局变量（浅色 / 深色）
   ============================================================ */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93; --text3:#C7C7CC;
  --sep:rgba(60,60,67,.10); --accent:#007AFF; --up:#FF3B30; --down:#34C759;
  --fill:rgba(120,120,128,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --text2:#98989F; --text3:#48484A;
    --sep:rgba(84,84,88,.4); --fill:rgba(120,120,128,.24);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
input,textarea,select,button{font-family:inherit;font-size:16px;color:var(--text)}
input,textarea,select{background:transparent;border:none;outline:none;width:100%;padding:0;resize:none}
input::placeholder,textarea::placeholder{color:var(--text3)}
select{appearance:none;-webkit-appearance:none;text-align:right;direction:rtl}
input[type=date]{appearance:none;-webkit-appearance:none;text-align:center}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.35}

/* ============================================================
   整体布局：主容器 / 顶栏 / 卡片
   ============================================================ */
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:140px}
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
  background:rgba(242,242,247,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
@media (prefers-color-scheme:dark){ .topbar{background:rgba(0,0,0,.72)} }
.topbar>div:first-child{flex:1;min-width:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.6px;margin:0;line-height:1.15}
.sub{font-size:13px;color:var(--text2);margin-top:2px}
.topbar-actions{display:flex;gap:10px;flex:0 0 auto;align-items:center}

.icon-btn{
  flex:0 0 38px;width:38px;height:38px;border-radius:50%;border:none;background:var(--card);
  color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .2s,color .2s;
}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.92);color:var(--accent)}
.icon-btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,122,255,.28)}
.icon-btn.primary:active{opacity:.8}

.card{
  background:var(--card);border-radius:16px;padding:14px 16px;margin:0 16px 12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .22s cubic-bezier(.32,.72,0,1);
}
.card.tap:active{transform:scale(.975)}
.card-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.4px;margin-bottom:4px}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.card-title-row .card-title{margin:0}
.sub-label{font-size:12px;color:var(--text2);margin:12px 0 6px;font-weight:500}
.sub-label.up{color:var(--up)} .sub-label.down{color:var(--down)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:none}
.row>label{flex:0 0 auto;color:var(--text2);font-size:15px}
.row input{text-align:right;font-variant-numeric:tabular-nums}
.block{padding:10px 0;border-bottom:.5px solid var(--sep)}
.block:last-child{border-bottom:none}
.block>label{display:block;color:var(--text2);font-size:13px;margin-bottom:4px}
.block textarea{text-align:left;line-height:1.5}
.hint{font-size:13px;color:var(--text3);padding:6px 0}
.foot-note{text-align:center;font-size:12px;color:var(--text3);padding:8px 0 20px}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 8px}
.link-btn:active{opacity:.6}

/* ============================================================
   每日复盘 · 方向跟踪
   ============================================================ */
.dir-item{padding:12px 0;border-bottom:.5px solid var(--sep);}
.dir-item:last-child{border-bottom:none;}
.dir-item:first-child{padding-top:6px;}
.dir-head{display:flex;align-items:center;gap:8px;}
.dir-name{
  flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.1px;
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0;
}
.tag-pill{
  border:none;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;
  cursor:pointer;white-space:nowrap;flex:0 0 auto;line-height:1.3;
}
.tag-pill:active{opacity:.7;}
.tag-pill.empty{background:transparent;color:var(--text3);border:1px dashed var(--text3);font-weight:500;padding:2px 7px;}
.expand-arrow{
  flex:0 0 20px;width:20px;height:20px;border:none;background:transparent;
  color:var(--text3);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.expand-arrow.on{transform:rotate(180deg);}
.expand-arrow svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.dir-body{margin-top:10px;}
.br-item{background:var(--fill);border-radius:10px;padding:10px 12px;margin-top:8px;}
.br-item:first-child{margin-top:0;}
.br-head{display:flex;align-items:center;gap:6px;}
.br-name{
  flex:1;min-width:0;font-size:14px;font-weight:600;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0;
}
.br-body{margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);}
.st-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:.5px solid var(--sep);}
.st-item:last-of-type{border-bottom:none;}
.st-name{
  flex:1;min-width:0;font-size:13px;font-weight:500;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);
}
.st-tags{display:flex;gap:4px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
.st-note-row{padding:8px 0 6px 0;}
.line-note-input{
  width:100%;background:var(--fill);border-radius:8px;padding:8px 10px;
  font-size:13px;text-align:left;color:var(--text);margin-top:4px;
}
.line-note-input::placeholder{color:var(--text3);}
.br-item .line-note-input{background:var(--card);}
.st-note-row .line-note-input{background:var(--card);font-size:12px;}

/* ============================================================
   每日复盘 · 周期轨迹
   ============================================================ */
.track{margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);}
.track-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.track-title{font-size:11px;color:var(--text3);letter-spacing:.3px;}
.track-days{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;scrollbar-width:none;}
.track-days::-webkit-scrollbar{display:none;}
.track-day{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;padding:0;cursor:pointer;min-width:36px;
}
.track-day:active .track-day-pill{transform:scale(.94);}
.track-day-pill{
  display:inline-block;padding:4px 6px;border-radius:7px;
  font-size:10px;font-weight:600;line-height:1.1;white-space:nowrap;
  background:var(--fill);color:var(--text3);transition:transform .15s;
}
.track-day-pill.off{visibility:hidden;}
.track-day-date{font-size:10px;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.track-day.holiday .track-day-date{color:var(--text3);opacity:.5;}
.track-day.cur .track-day-pill{box-shadow:0 0 0 1.5px var(--accent);}
.track-day.cur .track-day-date{color:var(--accent);font-weight:600;opacity:1;}

/* ============================================================
   每日复盘 · 市场环境
   ============================================================ */
.env-btn{
  position:relative;width:100%;display:flex;align-items:center;justify-content:center;
  background:var(--fill);border-radius:12px;padding:14px 40px;border:none;cursor:pointer;margin-top:8px;
  font-size:16px;font-weight:500;color:var(--text);text-align:center;
}
.env-btn:active{transform:scale(.985);opacity:.8;}
.env-btn.active{font-weight:600;}
.env-btn>span{display:block;width:100%;text-align:center;}
.env-btn .env-arrow{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.env-btn.active .env-arrow{stroke:currentColor;}

.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:6px;}
.data-cell{display:flex;align-items:center;gap:8px;padding:6px 0;}
.data-cell>label{flex:0 0 52px;color:var(--text2);font-size:13px;}
.data-cell input{
  flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;
  background:var(--fill);border-radius:8px;padding:7px 10px;
}

/* ============================================================
   每日复盘 · 连板梯队（市场高标 + 高度分布）
   ============================================================ */
.topboard-row{display:flex;align-items:center;gap:6px;margin-top:2px;}
.topboard-num{
  flex:0 0 50px;background:var(--fill);border-radius:8px;padding:8px 0;text-align:center;
  font-size:15px;font-variant-numeric:tabular-nums;color:var(--text);
}
.topboard-num::placeholder{color:var(--text3);}
.topboard-unit{flex:0 0 auto;color:var(--text2);font-size:14px;}
.topboard-name{
  flex:1;min-width:0;background:var(--fill);border-radius:8px;padding:8px 10px;
  text-align:center;font-size:15px;color:var(--text);
}
.topboard-name::placeholder{color:var(--text3);}

.board-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:6px;}
.board-cell{display:flex;align-items:center;gap:8px;}
.board-cell-full{grid-column:1 / -1;}
.board-cell>label{flex:0 0 auto;color:var(--text2);font-size:13px;white-space:nowrap;}
.board-cell input{
  flex:1;width:100%;text-align:center;font-variant-numeric:tabular-nums;
  font-size:14px;background:var(--fill);border-radius:8px;padding:9px 10px;
}
.board-cell input::placeholder{color:var(--text3);}

/* ============================================================
   每日复盘 · 板块复盘
   ============================================================ */
.sector-block{padding:10px 0;border-bottom:.5px solid var(--sep);}
.sector-block:last-child{border-bottom:none;}
.sector-row1{display:flex;align-items:center;gap:8px;}
.sector-name{flex:1;background:var(--fill);border-radius:9px;padding:8px 10px;font-size:15px;text-align:left;}
.sector-pct{flex:0 0 78px;background:var(--fill);border-radius:9px;padding:8px 10px;font-size:15px;text-align:center;}
.sector-leader{width:100%;background:var(--fill);border-radius:9px;padding:8px 10px;font-size:14px;text-align:left;margin-top:6px;}
.sector-leader::placeholder{color:var(--text3);}

/* ============================================================
   通用：标签选择面板
   ============================================================ */
.picker-list{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px;}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .15s;}
.picker-item:last-child{border-bottom:none;}
.picker-item:active{background:var(--fill);}
.picker-dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;}
.picker-body{flex:1;min-width:0;}
.picker-name{font-size:15px;font-weight:600;letter-spacing:-.1px;}
.picker-desc{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4;}
.picker-check{flex:0 0 20px;color:var(--accent);font-size:16px;font-weight:700;opacity:0;text-align:right;}
.picker-item.on .picker-check{opacity:1;}
.picker-item.on .picker-name{color:var(--accent);}

/* ============================================================
   通用：新建输入面板（iOS 风格）
   ============================================================ */
.input-sheet-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;}
.input-sheet-btn{background:none;border:none;cursor:pointer;padding:4px 0;font-size:16px;color:var(--accent);font-weight:400;min-width:52px;}
.input-sheet-btn:first-child{text-align:left;}
.input-sheet-btn:last-child{text-align:right;}
.input-sheet-btn.primary{font-weight:600;}
.input-sheet-btn:disabled{color:var(--text3);cursor:default;}
.input-sheet-title{
  flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.input-sheet-field{width:100%;background:var(--fill);border-radius:11px;padding:13px 14px;font-size:16px;text-align:left;color:var(--text);}
.input-sheet-field::placeholder{color:var(--text3);}

/* ============================================================
   通用：标签管理
   ============================================================ */
.tag-mgr-item{background:var(--fill);border-radius:10px;padding:8px 10px;margin-top:6px;}
.tag-mgr-row1{display:flex;align-items:center;gap:8px;}
.tag-mgr-color{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;padding:0;}
.tag-mgr-color:active{transform:scale(.9);}
.tag-mgr-name{flex:1;background:var(--card);border-radius:8px;padding:8px 10px;font-size:14px;text-align:left;}
.tag-mgr-desc{margin-top:6px;background:var(--card);border-radius:8px;padding:7px 10px;font-size:12px;text-align:left;color:var(--text2);width:100%;}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.color-swatch{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s;}
.color-swatch:active{transform:scale(.92);}
.color-swatch.on{border-color:var(--text);box-shadow:0 0 0 3px var(--card) inset;}

/* ============================================================
   通用：小图标 / 动态行 / 添加按钮
   ============================================================ */
.del{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:none;background:var(--fill);color:var(--text2);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.addrow{width:100%;background:none;border:none;color:var(--accent);font-size:14px;padding:9px 0 2px;text-align:left;cursor:pointer;}
.dynrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--sep)}
.dynrow:last-child{border-bottom:none}
.dynrow input{text-align:left;background:var(--fill);border-radius:9px;padding:7px 10px;font-size:15px}
.dynrow .grow{flex:1 1 0;min-width:0}
.dynrow .tiny{flex:0 0 76px;text-align:center}
.dynrow .sel{flex:0 0 82px;background:var(--fill);border-radius:9px;padding:7px 8px;font-size:14px;text-align:left;direction:ltr}

/* ============================================================
   通用：日期栏
   ============================================================ */
.datebar{display:flex;align-items:center;gap:6px;margin:0 16px 12px;}
.datebar input{flex:1;background:var(--card);border-radius:12px;padding:10px;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.navbtn{
  flex:0 0 40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--accent);
  font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.navbtn:active{opacity:.6;}

/* ============================================================
   通用：卡片内元素（标题、徽章等）
   ============================================================ */
.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stock-name{font-size:17px;font-weight:600;letter-spacing:-.2px;}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge-blue{background:rgba(0,122,255,.14);color:#007AFF}
.badge-gray{background:var(--fill);color:var(--text2)}
.badge-orange{background:rgba(255,149,0,.16);color:#FF9500}
.badge-buy{background:rgba(255,59,48,.12);color:#FF3B30}
.badge-sell{background:rgba(52,199,89,.12);color:#34C759}
.badge-env{background:rgba(120,120,128,.14);color:var(--text2);font-size:10px;padding:2px 8px;font-weight:500}
.date-line{font-size:12px;color:var(--text2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;background:var(--fill);color:var(--text2);padding:4px 9px;border-radius:8px;line-height:1.3}
.expect{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:.5px solid var(--sep)}
.trade-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--text2);margin-top:8px;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.note{font-size:13px;color:var(--text2);margin-top:7px;line-height:1.5}
.note b{color:var(--text3);font-weight:500;margin-right:6px;font-size:12px}

/* ============================================================
   交易复盘：顶部切换 / 筛选
   ============================================================ */
.trade-tabs{display:flex;gap:6px;margin:0 16px 12px;background:var(--fill);border-radius:12px;padding:4px;}
.trade-tabs button{flex:1;border:none;background:transparent;color:var(--text2);font-size:14px;font-weight:500;padding:8px 0;border-radius:9px;cursor:pointer;transition:background .18s,color .18s;}
.trade-tabs button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.summary-filter{display:flex;gap:6px;margin:0 16px 12px;}
.summary-filter button{flex:1;border:none;background:var(--fill);color:var(--text2);font-size:13px;font-weight:500;padding:7px 0;border-radius:9px;cursor:pointer;transition:background .18s,color .18s;}
.summary-filter button.on{background:var(--accent);color:#fff;font-weight:600;}

/* ============================================================
   交易复盘：统计卡片（计划·模式 统计 / 总体统计）
   ============================================================ */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid+.stat-grid{margin-top:10px}
.stat-box{background:var(--fill);border-radius:11px;padding:11px 12px}
.stat-box-title{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.stat-box-num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;margin-bottom:6px}
.stat-box-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums}
.stat-box-row span:last-child{color:var(--text);font-weight:500}

.overall-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 8px;padding:6px 0 2px;}
.overall-stats .o-item{text-align:center}
.overall-stats .o-num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;display:block}
.overall-stats .o-lbl{font-size:11px;color:var(--text2);margin-top:3px;display:block}

.summary{display:flex;justify-content:space-around;text-align:center;padding:16px}
.sum-num{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.sum-lbl{font-size:11px;color:var(--text2);margin-top:2px}

/* ============================================================
   每日计划
   ============================================================ */
.plan-datebar{display:flex;align-items:center;gap:6px;margin:8px 0 12px}
.plan-datebar input{flex:1;background:var(--fill);border-radius:11px;padding:9px;font-size:14px;font-weight:600;text-align:center}
.plan-datebar .navbtn{background:var(--fill);box-shadow:none;flex:0 0 36px;height:36px;font-size:18px}
.plan-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:.5px solid var(--sep)}
.plan-item:last-of-type{border-bottom:none}
.plan-item .plan-check{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--text3);
  background:transparent;color:#fff;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;padding:0;
}
.plan-item .plan-check.on{background:var(--accent);border-color:var(--accent)}
.plan-item .plan-text{flex:1;font-size:15px;padding:4px 0;min-width:0}
.plan-item.done .plan-text{color:var(--text3);text-decoration:line-through}
.plan-progress{font-size:12px;color:var(--text2);padding:8px 0 0;font-variant-numeric:tabular-nums}
.plan-result{font-size:13px;padding:10px 12px;border-radius:9px;line-height:1.5;margin-top:2px}
.plan-result.good{color:#34C759;background:rgba(52,199,89,.1)}
.plan-result.warn{color:#FF9500;background:rgba(255,149,0,.1)}
.plan-result.info{color:var(--text2);background:var(--fill)}
.trade-plan{background:var(--fill);border-radius:11px;padding:11px 12px;margin-top:10px}
.trade-plan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.trade-plan-stock{font-size:15px;font-weight:600;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trade-plan-pick{font-size:11px;color:var(--text3);margin-left:6px;font-weight:400}
.tp-row{display:flex;gap:8px;padding:4px 0;align-items:flex-start}
.tp-row>label{flex:0 0 36px;color:var(--text2);font-size:12px;padding-top:8px}
.tp-row input,.tp-row textarea{flex:1;background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px;line-height:1.4}
.tp-row textarea{min-height:48px;text-align:left}
.tp-empty{font-size:13px;color:var(--text3);padding:6px 0}

/* ============================================================
   交易复盘 · 汇总卡片
   ============================================================ */
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sum-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sum-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.sum-status.holding{background:rgba(0,122,255,.14);color:#007AFF}
.sum-status.closed{background:var(--fill);color:var(--text2)}
.sum-meta{font-size:12px;color:var(--text2);margin-top:4px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;text-align:center}
.sum-grid .g-num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.sum-grid .g-lbl{font-size:11px;color:var(--text2);margin-top:2px;display:block}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}
.sum-row .k{color:var(--text2)}
.sum-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.sum-ops{margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep)}
.sum-op-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;color:var(--text2);font-variant-numeric:tabular-nums}
.sum-op-dir{flex:0 0 auto;font-weight:600;padding:1px 6px;border-radius:5px;font-size:11px}
.sum-op-dir.buy{background:rgba(255,59,48,.12);color:#FF3B30}
.sum-op-dir.sell{background:rgba(52,199,89,.12);color:#34C759}
.sum-op-date{flex:0 0 auto;width:52px}
.sum-op-price{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-op-qty{flex:0 0 auto;color:var(--text3)}
.sum-warn{font-size:12px;color:#FF9500;padding:8px 10px;background:rgba(255,149,0,.1);border-radius:8px;margin-top:10px;line-height:1.5}

/* ============================================================
   交易模式：模式卡片 / 分环境表现 / 多模式对比
   ============================================================ */
.mode-envs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mode-env{font-size:11px;padding:3px 9px;border-radius:7px;font-weight:600}
.mode-top{display:flex;align-items:center;gap:16px;margin-top:12px}
.mode-ring{flex:0 0 60px}
.mode-stats-list{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.stat-row .stat-lbl{color:var(--text2)}
.stat-row .stat-num{font-weight:600;font-variant-numeric:tabular-nums}
.mode-desc{margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep);font-size:13px;color:var(--text2);line-height:1.6}
.mode-desc b{display:inline-block;min-width:34px;color:var(--text3);font-weight:500;font-size:12px;margin-right:4px}
.mode-card{cursor:pointer}
.mode-card .mode-extended{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s cubic-bezier(.32,.72,0,1), opacity .3s;
}
.mode-card.expanded .mode-extended{max-height:2400px;opacity:1;}
.mode-chevron{
  width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.32,.72,0,1);flex:0 0 16px;
}
.mode-chevron.open{transform:rotate(180deg);}

.adv-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;
  margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep);}
.adv-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:4px 0}
.adv-row .k{color:var(--text2);font-size:12px}
.adv-row .v{font-variant-numeric:tabular-nums;font-weight:500}
.adv-row .v.mono-big{font-weight:600}

.env-stat-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:.5px solid var(--sep);}
.env-stat-row:last-child{border-bottom:none;}
.env-stat-name{flex:1;min-width:0;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.env-stat-n{flex:0 0 auto;color:var(--text2);font-variant-numeric:tabular-nums;font-size:12px;min-width:34px;text-align:right;}
.env-stat-wr{flex:0 0 auto;color:var(--text2);font-variant-numeric:tabular-nums;font-size:12px;min-width:42px;text-align:right;}
.env-stat-total{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;min-width:62px;text-align:right;}
.env-section-title{font-size:11px;color:var(--text3);margin-top:14px;padding-top:10px;border-top:.5px solid var(--sep);}

.compare-pick-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--sep);cursor:pointer}
.compare-pick-row:last-child{border-bottom:none}
.compare-check{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--text3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.compare-check.on{background:var(--accent);border-color:var(--accent)}
.compare-pick-name{flex:1;font-size:15px;font-weight:500}
.compare-pick-n{font-size:12px;color:var(--text2)}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.compare-table th,.compare-table td{padding:8px 6px;text-align:right;border-bottom:.5px solid var(--sep)}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;color:var(--text2);font-weight:500;padding-left:0}
.compare-table th{font-weight:600;font-size:13px;padding-bottom:10px;color:var(--text)}
.compare-table tr:last-child td{border-bottom:none}
.compare-table .best{color:#34C759;font-weight:600}
.compare-color-1{color:#007AFF}
.compare-color-2{color:#FF9500}
.compare-color-3{color:#34C759}

/* ============================================================
   SVG 图表
   ============================================================ */
.chart-block{margin-top:14px;padding-top:10px;border-top:.5px solid var(--sep)}
.chart-title{font-size:12px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.chart-title .legend{font-size:11px;color:var(--text3)}
svg.spark-big{display:block;width:100%;height:90px;overflow:visible}
svg.winrate-trend{display:block;width:100%;height:70px;overflow:visible}
svg.pnl-bars{display:block;width:100%;height:44px;margin-top:10px;overflow:visible;max-width:320px;margin-left:auto;margin-right:auto}
.chart-empty{font-size:12px;color:var(--text3);text-align:center;padding:14px 0 4px}
svg.spark{display:block;width:100%;height:64px;margin-top:12px;overflow:visible}
.chart-label{font-size:11px;color:var(--text3);margin-top:10px}

/* ============================================================
   从选股中选择
   ============================================================ */
.pick-option{padding:12px 0;border-bottom:.5px solid var(--sep);cursor:pointer;transition:opacity .15s;position:relative}
.pick-option:active{opacity:.6}
.pick-option:last-child{border-bottom:none}
.pick-option-desc{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5;padding-right:24px}
.pick-option.selected::after{content:'✓';position:absolute;right:0;top:16px;color:var(--accent);font-size:20px;font-weight:700;line-height:1}

/* ============================================================
   分段按钮
   ============================================================ */
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.seg button{border:none;background:var(--fill);color:var(--text2);font-size:13px;font-weight:500;
  padding:6px 12px;border-radius:9px;cursor:pointer;transition:background .18s,color .18s,transform .18s;}
.seg button:active{transform:scale(.94)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

/* ============================================================
   空态
   ============================================================ */
.empty{text-align:center;padding:70px 40px 60px}
.empty svg.empty-icon{width:56px;height:56px;margin-bottom:14px;color:var(--text3);stroke-width:1.4}
.empty-title{font-size:17px;font-weight:600;color:var(--text2);margin-top:2px}
.empty-sub{font-size:13px;color:var(--text3);margin-top:8px;line-height:1.6}

/* ============================================================
   底部导航栏 / 悬浮按钮
   ============================================================ */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;
  display:flex;z-index:30;background:rgba(255,255,255,.84);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){ .tabbar{background:rgba(28,28,30,.82)} }
.tab{flex:1;background:none;border:none;padding:8px 0 9px;color:var(--text2);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;cursor:pointer;transition:color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab:active{opacity:.6}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:0;z-index:25;pointer-events:none}
.fab{
  position:absolute;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;border:none;pointer-events:auto;
  background:var(--accent);color:#fff;font-size:30px;font-weight:200;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,122,255,.34);transition:transform .22s,opacity .2s;
}
.fab:active{transform:scale(.9)}
.fab[hidden]{display:none}

/* ============================================================
   Sheet 底部弹层 / 遮罩
   ============================================================ */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translate(-50%,110%);
  background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 20px calc(28px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:transform .42s cubic-bezier(.32,.72,0,1);z-index:60;
}
.sheet.open{transform:translate(-50%,0)}
.handle{width:38px;height:5px;border-radius:3px;background:var(--text3);opacity:.5;margin:0 auto 14px}
.sheet-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px}
.sheet-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.frow>label{flex:0 0 76px;color:var(--text2);font-size:15px}
.btn-primary{width:100%;margin-top:18px;padding:14px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:active{opacity:.75}
.btn-secondary{width:100%;margin-top:10px;padding:14px;border-radius:14px;border:none;background:var(--fill);color:var(--accent);font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-secondary:active{opacity:.7}
.btn-danger{width:100%;margin-top:10px;padding:14px;border-radius:14px;border:none;background:rgba(255,59,48,.12);color:#FF3B30;font-size:16px;font-weight:600;cursor:pointer}
.btn-danger:active{opacity:.7}

/* ============================================================
   保存提示 / 致命错误兜底
   ============================================================ */
.save-hint{
  position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:5px 14px;border-radius:20px;
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);z-index:200;
}
.save-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.save-hint.error{background:rgba(255,59,48,.92)}

.fatal-overlay{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 32px;text-align:center;
}
.fatal-overlay.show{display:flex;}
.fatal-icon{width:64px;height:64px;stroke:#FF9500;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:20px;}
.fatal-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text);}
.fatal-desc{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:8px;max-width:380px;}
.fatal-msg{font-size:12px;color:var(--text3);background:var(--fill);padding:10px 14px;border-radius:10px;margin:12px 0 20px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;max-width:380px;line-height:1.5;}

/* ============================================================
   数据管理：存储监控
   ============================================================ */
.storage-bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:8px 0 4px;}
.storage-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.32,.72,0,1);}
.storage-fill.ok{background:#34C759;}
.storage-fill.warn{background:#FF9500;}
.storage-fill.danger{background:#FF3B30;}
.storage-text{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;}
.storage-alert{font-size:12px;padding:10px 12px;border-radius:9px;margin-top:10px;line-height:1.55;}
.storage-alert.warn{color:#FF9500;background:rgba(255,149,0,.1);}
.storage-alert.danger{color:#FF3B30;background:rgba(255,59,48,.1);}

/* ============================================================
   高标池
   ============================================================ */
.top-pool-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:.5px solid var(--sep);cursor:pointer;}
.top-pool-row:last-child{border-bottom:none;}
.top-pool-row:active{opacity:.7;}
.top-pool-name{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-pool-meta{flex:0 0 auto;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;}
.top-pool-meta b{color:var(--up);font-weight:700;}
.pool-history-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 2px;border-bottom:.5px solid var(--sep);font-size:14px;}
.pool-history-row:last-child{border-bottom:none;}
.pool-history-date{color:var(--text2);font-variant-numeric:tabular-nums;}
.pool-history-h{font-weight:600;font-variant-numeric:tabular-nums;}

/* ============================================================
   复盘总览（全屏弹层）
   ============================================================ */
.overview-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;}
.overview-overlay.open{display:flex;}
.overview-topbar{
  flex:0 0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(242,242,247,.85);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
@media (prefers-color-scheme:dark){ .overview-topbar{background:rgba(0,0,0,.72)} }
.overview-topbar .title-block{flex:1;min-width:0}
.overview-topbar h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.3px}
.overview-topbar .subtitle{font-size:11px;color:var(--text2);margin-top:1px}
.ov-btn{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:none;
  background:var(--card);color:var(--text2);font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.ov-btn:active{transform:scale(.92);color:var(--accent)}
.ov-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.overview-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(24px + env(safe-area-inset-bottom));}

.ov-card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.ov-card-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:10px}
.ov-card-title.warn{color:#B36A00}
.ov-card-title.good{color:#1F8A3E}
@media (prefers-color-scheme:dark){
  .ov-card-title.warn{color:#FFB340}
  .ov-card-title.good{color:#5BD97C}
}
.change-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:13px;}
.change-row:last-child{border-bottom:none;}
.change-row .label{flex:0 0 52px;color:var(--text2);font-size:12px}
.change-row .flow{font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.change-row .from{color:var(--text2);font-weight:400}
.change-row .arrow{font-size:11px;color:var(--text3);margin:0 2px}
.change-row .to{font-weight:700}
.change-row .to.up{color:var(--up)}
.change-row .to.down{color:var(--down)}
.change-row .desc{flex:1;color:var(--text3);font-size:11px;text-align:right;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.change-empty{color:var(--text3);font-size:12px;text-align:center;padding:4px 0}

.core-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.core-name{font-size:17px;font-weight:700;letter-spacing:-.3px}
.core-cycle-flow{display:flex;align-items:center;gap:5px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
.core-cycle-flow .cyc-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;line-height:1.2}
.core-cycle-flow .arrow{font-size:12px;color:var(--text3)}
.core-branch{padding:6px 0;border-top:.5px solid var(--sep)}
.core-branch:first-of-type{border-top:none;padding-top:0}
.core-branch-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.core-branch-name{font-size:13px;font-weight:600}
.core-branch-tags{font-size:11px;color:var(--text3)}
.core-stock{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:3px 0 3px 12px;font-size:12px;}
.core-stock .sname{font-weight:600}
.core-stock .stags{font-size:10px;color:var(--text3)}

.side-line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:5px 0;font-size:12px;border-bottom:.5px solid var(--sep);}
.side-line:last-child{border-bottom:none}
.side-name{font-weight:600}
.side-imp{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.side-cycle{font-size:11px;color:var(--text2)}
.side-cyc-tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px}

.risk-item{display:flex;align-items:flex-start;gap:6px;padding:7px 9px;border-radius:8px;margin-bottom:5px;font-size:12px;line-height:1.5;}
.risk-item:last-child{margin-bottom:0}
.risk-item.warn{background:rgba(255,149,0,.10);color:#B36A00}
.risk-item.good{background:rgba(52,199,89,.10);color:#1F8A3E}
@media (prefers-color-scheme:dark){
  .risk-item.warn{color:#FFB340}
  .risk-item.good{color:#5BD97C}
}
.risk-icon{flex:0 0 auto;font-weight:700;font-size:12px;line-height:1.5}

    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'})[c];
  });
}
function pad2(n){ return String(n).padStart(2,'0'); }

  if (!hex || hex.charAt(0) !== '#') return 'rgba(142,142,147,' + a + ')';
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);

/* ============================================================

var HOLIDAYS = {
  '2025':['2025-01-01','2025-01-28','2025-01-29','2025-01-30','2025-01-31','2025-02-03','2025-02-04','2025-04-04','2025-04-07','2025-05-01','2025-05-02','2025-05-05','2025-06-02','2025-10-01','2025-10-02','2025-10-03','2025-10-06','2025-10-07','2025-10-08'],

};
function isTradingDay(dateStr){
  if (!dateStr) return false;
  var d = new Date(dateStr + 'T00:00:00');
  var dow = d.getDay();
  if (dow === 0 || dow === 6) return false;
  var y = String(d.getFullYear());
  if (HOLIDAYS[y] && HOLIDAYS[y].indexOf(dateStr) >= 0) return false;
  return true;
}
function tradingDaysBetween(startDate, endDate){
  if (!startDate || !endDate) return 0;
  if (startDate > endDate) return 0;
  var count = 0;
  var cur = new Date(startDate + 'T00:00:00');
  var end = new Date(endDate + 'T00:00:00');
  while (cur <= end) {
    var s = cur.getFullYear() + '-' + pad2(cur.getMonth()+1) + '-' + pad2(cur.getDate());
    if (isTradingDay(s)) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}
function dateMinusDays(dateStr, n){
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function dateAddDays(dateStr, n){ return dateMinusDays(dateStr, -n); }
function formatMD(dateStr){ var p = dateStr.split('-'); return p[1] + '/' + p[2]; }

/* ============================================================
   市场高标 topBoard 解析（字符串 → 对象）
   ============================================================ */
function emptyTopBoard(){ return { days:'', boards:'', name:'' }; }
function parseTopBoard(s){
  s = String(s == null ? '' : s).trim();
  if (!s) return emptyTopBoard();
  var m1 = s.match(/^(\d+)\s*天\s*(\d+)\s*板[\s·\-]*(.*)$/);
  if (m1) return { days:m1[1], boards:m1[2], name:(m1[3]||'').trim() };
  var m2 = s.match(/^(\d+)\s*板[\s·\-]*(.*)$/);
  if (m2) return { days:'', boards:m2[1], name:(m2[2]||'').trim() };
  return { days:'', boards:'', name:s };
}
function normalizeTopBoard(v){
  if (v && typeof v === 'object' && !Array.isArray(v)) {
    return { days: v.days == null ? '' : String(v.days), boards: v.boards == null ? '' : String(v.boards), name: v.name == null ? '' : String(v.name) };
  }
  if (typeof v === 'string') return parseTopBoard(v);
  return emptyTopBoard();
}

function seedReviews(){

/* 数据迁移：兼容旧格式 → 当前格式 */
function migrate(data){
  if (!data || typeof data !== 'object') return data;

  var v = (typeof data.dataVersion === 'number') ? data.dataVersion : 0;

  // v0 → v1：补齐基础结构
  if (v < 1) {
    if (!data.reviews || typeof data.reviews !== 'object') data.reviews = {};
    if (!Array.isArray(data.picks)) data.picks = [];
    if (!Array.isArray(data.trades)) data.trades = [];
    if (!data.plans || typeof data.plans !== 'object') data.plans = {};
    if (!Array.isArray(data.modes)) data.modes = [];
    data.trades.forEach(function(t){ if (t.inPlan === undefined) t.inPlan = true; });
  }
  // 老版本遗留：删除截图字段
  data.trades.forEach(function(t){ if (t.screenshot !== undefined) delete t.screenshot; });

  // 补齐 tagGroups
  if (!data.tagGroups || typeof data.tagGroups !== 'object') {
    data.tagGroups = JSON.parse(JSON.stringify(DEFAULT_TAG_GROUPS));
  } else {
    TAG_GROUP_ORDER.forEach(function(gk){
      var defaults = DEFAULT_TAG_GROUPS[gk];
      if (!data.tagGroups[gk] || typeof data.tagGroups[gk] !== 'object') {
        data.tagGroups[gk] = JSON.parse(JSON.stringify(defaults));
      } else {
        data.tagGroups[gk].label = defaults.label;
        if (!Array.isArray(data.tagGroups[gk].options)) {
          data.tagGroups[gk].options = JSON.parse(JSON.stringify(defaults.options));
        } else {
          data.tagGroups[gk].options = data.tagGroups[gk].options.map(function(o){
            if (typeof o.desc !== 'string') o.desc = '';
            if (!o.desc.trim()) {
              var def = defaults.options.find(function(d){ return d.id === o.id; });
              if (def && def.desc) o.desc = def.desc;
            }
            return o;
          });
        }
      }
    });
  }

  // reviews：兼容 marketEnv → sentiment
  if (!data.reviews || typeof data.reviews !== 'object') data.reviews = {};
  Object.keys(data.reviews).forEach(function(d){
    var r = data.reviews[d];
    if (!r || typeof r !== 'object') return;
    if (r.marketEnv && !r.sentiment) {
      var sentOpts = (data.tagGroups.sentiment && data.tagGroups.sentiment.options) || [];
      var oldName = String(r.marketEnv);
      var found = null;
      for (var i = 0; i < sentOpts.length; i++) {
        if (sentOpts[i].name === oldName || sentOpts[i].name + '期' === oldName) { found = sentOpts[i]; break; }
      }
      if (found) r.sentiment = found.id;
    }
    r.topBoard = normalizeTopBoard(r.topBoard);
    ['amount','kline','support','resistance','mainline','summary','marketEnv','marketEnvNote',
     'marketPhase','sentiment','limitUp','limitDown','maxBoard','yesterdayPremium',
     'envNote','ladderDirection','ladderNote','tomorrowFocus'].forEach(function(k){
      if (r[k] === undefined) r[k] = '';
    });
    if (!Array.isArray(r.strongSectors)) r.strongSectors = [];
    if (!Array.isArray(r.weakSectors)) r.weakSectors = [];
    if (!Array.isArray(r.ladders)) r.ladders = [];
    if (!r.firstBoard || typeof r.firstBoard !== 'object') r.firstBoard = { count:'', theme:'' };
    if (r.firstBoard.count === undefined) r.firstBoard.count = '';
    if (r.firstBoard.theme === undefined) r.firstBoard.theme = '';
    if (!r.boardCounts || typeof r.boardCounts !== 'object') r.boardCounts = { b6:'', b5:'', b4:'', b3:'', b2:'' };
    ['b6','b5','b4','b3','b2'].forEach(function(k){
      if (r.boardCounts[k] === undefined) r.boardCounts[k] = '';
    });
    r.strongSectors = r.strongSectors.map(function(s){
      if (s && typeof s === 'object') { if (s.leader === undefined) s.leader = ''; return s; }
      return { name:'', pct:'', leader:'' };
    });
    r.weakSectors = r.weakSectors.map(function(s){
      if (s && typeof s === 'object') { if (s.leader === undefined) s.leader = ''; return s; }
      return { name:'', pct:'', leader:'' };
    });
  });

  // lines：旧 main/subs → 新 directions
  if (!data.lines || typeof data.lines !== 'object') data.lines = { directions: [] };
  if (!Array.isArray(data.lines.directions)) data.lines.directions = [];
  if (data.lines.main || Array.isArray(data.lines.subs)) {
    var migratedDirs = [];
    if (data.lines.main && data.lines.main.name) {
      migratedDirs.push({ id: data.lines.main.id || ('dir_' + uid()), name: data.lines.main.name, importance:'main', branches:[], history:{} });
    }
    if (Array.isArray(data.lines.subs)) {
      data.lines.subs.forEach(function(s){
        if (s && s.name) migratedDirs.push({ id: s.id || ('dir_' + uid()), name: s.name, importance:'sub', branches:[], history:{} });
      });
    }
    data.lines = { directions: migratedDirs };
  }
  var latestReviewDate = Object.keys(data.reviews).sort().pop() || todayStr();
  data.lines.directions = data.lines.directions.filter(function(d){
    return d && typeof d === 'object' && typeof d.id === 'string' && typeof d.name === 'string';
  }).map(function(d){
    if (d.importance === undefined) d.importance = '';
    if (!d.history || typeof d.history !== 'object') d.history = {};
    if (d.cycle !== undefined || d.note !== undefined) {
      if (!d.history[latestReviewDate]) d.history[latestReviewDate] = {};
      if (d.cycle) d.history[latestReviewDate].cycle = d.cycle;
      if (d.note) d.history[latestReviewDate].note = d.note;
      delete d.cycle; delete d.note;
    }
    if (!Array.isArray(d.branches)) d.branches = [];
    d.branches = d.branches.map(function(b){
      if (b.performance === undefined) b.performance = '';
      if (b.structure === undefined) b.structure = '';
      if (b.note === undefined) b.note = '';
      if (!Array.isArray(b.stocks)) b.stocks = [];
      b.stocks = b.stocks.map(function(s){
        if (s.status === undefined) s.status = '';
        if (s.board === undefined) s.board = '';
        if (s.today === undefined) s.today = '';
        if (s.note === undefined) s.note = '';
        return s;
      });
      return b;
    });
    return d;
  });

  // modes：旧 env 名 → 新 sentiment id
  var sentOpts2 = (data.tagGroups.sentiment && data.tagGroups.sentiment.options) || [];
  function findSentId(oldVal){
    if (!oldVal) return '';
    for (var i = 0; i < sentOpts2.length; i++) {
      var n = sentOpts2[i].name;
      if (n === oldVal || n + '期' === oldVal) return sentOpts2[i].id;
    }
    for (var j = 0; j < sentOpts2.length; j++) if (sentOpts2[j].id === oldVal) return oldVal;
    return '';
  }
  if (Array.isArray(data.modes)) {
    data.modes.forEach(function(m){
      if (!Array.isArray(m.envs)) { m.envs = []; return; }
      var seen = {};
      var newEnvs = [];
      m.envs.forEach(function(x){
        var id = findSentId(x);
        if (id && !seen[id]) { seen[id] = 1; newEnvs.push(id); }
      });
      m.envs = newEnvs;
    });
  }

  if (data.envOptions !== undefined) delete data.envOptions;
  data.dataVersion = CURRENT_VERSION;
  return data;
}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    clearAggCache();

    if (status.level === 'danger') showSaveHint('⚠ 存储空间不足，请尽快导出备份', true, 4000);
    return true;
  } catch(e) {
    var isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(e.message || ''));
    var msg = isQuota ? '⚠ 存储已满，最新改动没有保存！请立即导出备份' : '⚠ 保存失败：' + (e.message || '未知错误');
    showSaveHint(msg, true, 5000);
    return false;
  }
}

function getStorageSize(){ try { return new Blob([localStorage.getItem(KEY) || '']).size; } catch(e){ return 0; } }
function formatBytes(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function getStorageStatus(){
  var size = getStorageSize();
  var pct = size / STORAGE_LIMIT;
  if (size >= STORAGE_DANGER) return { size:size, pct:pct, level:'danger' };
  if (size >= STORAGE_WARN) return { size:size, pct:pct, level:'warn' };
  return { size:size, pct:pct, level:'ok' };
}

/* ============================================================
   交易：方向判定 / 按股票聚合
   ============================================================ */
function getDirection(t){
  var hasBuy = num(t.buyPrice) !== null;
  var hasSell = num(t.sellPrice) !== null;
  if (hasBuy && !hasSell) return 'buy';
  if (hasSell && !hasBuy) return 'sell';
  if (hasBuy && hasSell) return 'both';
  return null;
}
function aggregateTrades(trades){
  var groups = {};
  var ordered = trades.slice().reverse();
  var seqCounter = 0;
  ordered.forEach(function(t){
    var name = (t.name || '').trim();
    if (!name) return;
    var dir = getDirection(t);
    var qty = num(t.qty) || 0;
    if (!dir || qty <= 0) return;
    if (!groups[name]) groups[name] = { name:name, ops:[], tradeList:[], warnings:[], firstBuyTrade:null, hasUnplanned:false };
    var g = groups[name];
    g.tradeList.push(t);
    if ((dir === 'buy' || dir === 'both') && !g.firstBuyTrade) g.firstBuyTrade = t;
    if (t.inPlan === false) g.hasUnplanned = true;
    if (dir === 'buy') g.ops.push({ date:t.date, dir:'buy', price:num(t.buyPrice), qty:qty, tid:t.id, _seq:seqCounter++ });
    else if (dir === 'sell') g.ops.push({ date:t.date, dir:'sell', price:num(t.sellPrice), qty:qty, tid:t.id, _seq:seqCounter++ });
    else if (dir === 'both') {
      g.ops.push({ date:t.date, dir:'buy', price:num(t.buyPrice), qty:qty, tid:t.id, _seq:seqCounter++ });
      g.ops.push({ date:t.date, dir:'sell', price:num(t.sellPrice), qty:qty, tid:t.id, _seq:seqCounter++ });
    }
  });
  Object.keys(groups).forEach(function(name){
    var g = groups[name];
    g.ops.sort(function(a, b){
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      if (a.dir !== b.dir) return a.dir === 'buy' ? -1 : 1;
      return a._seq - b._seq;
    });
    var holdQty = 0, holdCost = 0, totalBuyQty = 0, totalSellQty = 0;
    var realizedPnl = 0, firstBuyDate = null, lastSellDate = null, everHeld = false;
    g.ops.forEach(function(op){
      if (op.dir === 'buy') {
        holdQty += op.qty; holdCost += op.price * op.qty; totalBuyQty += op.qty;
        if (!firstBuyDate) firstBuyDate = op.date;
        everHeld = true;
      } else if (op.dir === 'sell') {
        if (holdQty <= 0) { g.warnings.push('卖出超过持仓：' + op.date); return; }
        var sellQty = Math.min(op.qty, holdQty);
        var avg = holdCost / holdQty;
        realizedPnl += (op.price - avg) * sellQty;
        holdQty -= sellQty; holdCost -= avg * sellQty;
        totalSellQty += sellQty; lastSellDate = op.date;
      }
    });
    g.holdQty = holdQty;
    g.avgCost = holdQty > 0 ? holdCost / holdQty : 0;
    g.totalBuyQty = totalBuyQty;
    g.totalSellQty = totalSellQty;
    g.realizedPnl = realizedPnl;
    g.firstBuyDate = firstBuyDate;
    g.lastSellDate = lastSellDate;
    g.everHeld = everHeld;
    g.status = holdQty > 0 ? 'holding' : 'closed';
    g.firstModeId = g.firstBuyTrade ? (g.firstBuyTrade.modeId || '') : '';
    g.firstModeName = '';
    if (g.firstModeId && g.firstModeId !== 'outside') {
      var m = S.modes.find(function(x){ return x.id === g.firstModeId; });
      if (m) g.firstModeName = m.name;
    }
    if (g.status === 'holding') g.holdingDays = tradingDaysBetween(g.firstBuyDate, todayStr());
    else if (g.firstBuyDate && lastSellDate) g.holdingDays = tradingDaysBetween(g.firstBuyDate, lastSellDate);
    else g.holdingDays = 0;
  });
  return groups;
}
var _aggCache = null, _aggCacheKey = '';
function aggregateList(trades){
  var key = trades.length + ':';
  if (trades.length > 0) key += (trades[0].id || '') + ':' + (trades[trades.length - 1].id || '');
  if (_aggCache && _aggCacheKey === key) return _aggCache;
  var groups = aggregateTrades(trades);
  var list = Object.keys(groups).map(function(k){ return groups[k]; });
  _aggCache = list; _aggCacheKey = key;
  return list;
}
function clearAggCache(){ _aggCache = null; _aggCacheKey = ''; }

/* 导入数据校验 */
function validateImportData(data){
  var errors = [];
  if (!data || typeof data !== 'object') { errors.push('文件内容不是有效的对象'); return errors; }
  if (!Array.isArray(data.modes)) errors.push('缺少「交易模式」数组');
  else data.modes.forEach(function(m, i){
    if (!m || typeof m !== 'object') errors.push('模式 #' + (i+1) + ' 格式错误');
    else if (typeof m.name !== 'string' || !m.name.trim()) errors.push('模式 #' + (i+1) + ' 缺少名称');
    else if (typeof m.id !== 'string' || !m.id) errors.push('模式 #' + (i+1) + ' 缺少 id');
  });
  if (data.trades !== undefined && !Array.isArray(data.trades)) errors.push('交易记录不是数组');
  else if (Array.isArray(data.trades)) data.trades.forEach(function(t, i){
    if (!t || typeof t !== 'object') errors.push('交易 #' + (i+1) + ' 格式错误');
    else if (typeof t.id !== 'string') errors.push('交易 #' + (i+1) + ' 缺少 id');
    else if (typeof t.date !== 'string') errors.push('交易 #' + (i+1) + ' 缺少日期');
  });
  if (data.picks !== undefined && !Array.isArray(data.picks)) errors.push('选股记录不是数组');
  if (data.reviews !== undefined && (typeof data.reviews !== 'object' || Array.isArray(data.reviews))) errors.push('每日复盘数据格式错误');
  if (data.plans !== undefined && (typeof data.plans !== 'object' || Array.isArray(data.plans))) errors.push('每日计划数据格式错误');
  return errors;
}

function getReview(d){
  if (!S.reviews[d]) S.reviews[d] = {};
  var r = S.reviews[d];
  r.topBoard = normalizeTopBoard(r.topBoard);
  ['amount','kline','support','resistance','mainline','summary','marketEnv','marketEnvNote',
   'marketPhase','sentiment','limitUp','limitDown','maxBoard','yesterdayPremium',
   'envNote','ladderDirection','ladderNote','tomorrowFocus'].forEach(function(k){
    if (r[k] === undefined) r[k] = '';
  });
  if (!Array.isArray(r.strongSectors)) r.strongSectors = [];
  if (!Array.isArray(r.weakSectors)) r.weakSectors = [];
  if (!r.firstBoard || typeof r.firstBoard !== 'object') r.firstBoard = { count:'', theme:'' };
  if (r.firstBoard.count === undefined) r.firstBoard.count = '';
  if (r.firstBoard.theme === undefined) r.firstBoard.theme = '';
  if (!r.boardCounts || typeof r.boardCounts !== 'object') r.boardCounts = { b6:'', b5:'', b4:'', b3:'', b2:'' };
  ['b6','b5','b4','b3','b2'].forEach(function(k){
    if (r.boardCounts[k] === undefined) r.boardCounts[k] = '';
  });
  return r;
}
function setByPath(obj, path, val){
  var parts = path.split('.');
  var o = obj;
  for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}

/* 周期轨迹：近 20 自然日，周末/节假日留空，当前日靠右 */
function renderTrack(dir){
  var today = todayStr();
  var windowStart, windowEnd;
  if (curDate >= dateMinusDays(today, 19)) { windowStart = dateMinusDays(today, 19); windowEnd = today; }
  else { windowStart = dateMinusDays(curDate, 19); windowEnd = curDate; }
  var days = [];
  var c = windowStart;
  while (c <= windowEnd) { days.push(c); c = dateAddDays(c, 1); }
  var daysHtml = days.map(function(d){
    var isCur = (d === curDate);
    var trading = isTradingDay(d);
    if (!trading) {
      return '<button class="track-day holiday' + (isCur ? ' cur' : '') + '" onclick="jumpToDate(\'' + d + '\')">' +
        '<span class="track-day-pill off"></span><span class="track-day-date">' + formatMD(d) + '</span></button>';
    }
    var cyc = getDirCycle(dir, d);
    var opt = getTag('cycle', cyc);
    var pillStyle = opt ? 'background:' + hexToRgba(opt.color, 0.15) + ';color:' + opt.color : '';
    var label = opt ? opt.name : '未设';
    return '<button class="track-day' + (isCur ? ' cur' : '') + '" onclick="jumpToDate(\'' + d + '\')">' +
      '<span class="track-day-pill" style="' + pillStyle + '">' + esc(label) + '</span>' +
      '<span class="track-day-date">' + formatMD(d) + '</span></button>';
  }).join('');
  var jumpBtn = (curDate !== today) ? '<button class="link-btn" onclick="jumpToToday()">回到今日</button>' : '';
  return '<div class="track"><div class="track-title-row"><span class="track-title">周期轨迹 · 近 20 日</span>' + jumpBtn + '</div>' +
    '<div class="track-days">' + daysHtml + '</div></div>';
}
function scrollTracksToCurrent(){
  requestAnimationFrame(function(){
    $$('.track-days').forEach(function(el){
      var cur = el.querySelector('.track-day.cur');
      if (!cur) { el.scrollLeft = el.scrollWidth; return; }
      var targetScroll = cur.offsetLeft - (el.clientWidth - cur.offsetWidth - 16);
      var maxScroll = el.scrollWidth - el.clientWidth;
      if (targetScroll > maxScroll) targetScroll = maxScroll;
      if (targetScroll < 0) targetScroll = 0;
      el.scrollLeft = targetScroll;
    });
  });
}

function openInputSheet(title, placeholder, onSubmit, initialValue){
  var html = '<div class="input-sheet-header">' +
    '<button type="button" class="input-sheet-btn" id="input-cancel">取消</button>' +
    '<div class="input-sheet-title">' + esc(title) + '</div>' +
    '<button type="button" class="input-sheet-btn primary" id="input-confirm" disabled>完成</button></div>' +
    '<input type="text" class="input-sheet-field" id="input-field" value="' + esc(initialValue || '') + '" placeholder="' + esc(placeholder) + '" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">';
  openSheet(html);
  var field = $('#input-field'), confirmBtn = $('#input-confirm'), cancelBtn = $('#input-cancel');
  function updateState(){ confirmBtn.disabled = !field.value.trim(); }
  updateState();
  field.addEventListener('input', updateState);
  function submit(){
    var v = field.value.trim(); if (!v) return;
    var result = onSubmit(v);
    if (result === false) { field.focus(); field.select(); return; }
    closeSheet();
  }
  field.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  cancelBtn.onclick = closeSheet;
  confirmBtn.onclick = submit;
  setTimeout(function(){ field.focus(); }, 160);
}

window.addBranch = function(dirId){

  openInputSheet('新建分支', '如：光模块', function(name){
    if (!Array.isArray(dir.branches)) dir.branches = [];
    if (dir.branches.some(function(b){ return b.name === name; })) { alert('该方向下已有同名分支'); return false; }
    dir.branches.push({ id:'br_' + uid(), name:name, performance:'', structure:'', note:'', stocks:[] });
    save(); render();
  });
};
window.addStock = function(dirId, brId){
  var dir = findDirById(dirId); if (!dir) return;
  var br = findBranchById(dir, brId); if (!br) return;

function bindReview(root){
  $$('input[data-scope],textarea[data-scope]', root).forEach(function(inp){
    var scope = inp.dataset.scope;
    if (scope === 'bc') {
      inp.addEventListener('input', function(){
        var r = getReview(curDate);
        var k = inp.dataset.bk;
        var v = inp.value.replace(/[^\d]/g, '');
        if (v !== inp.value) inp.value = v;
        r.boardCounts[k] = v; saveSoon();
      });
    } else if (scope === 'tb') {
      inp.addEventListener('input', function(){
        var r = getReview(curDate);
        var k = inp.dataset.tk;
        var v = inp.value;
        if (k === 'days' || k === 'boards') { v = v.replace(/[^\d]/g, ''); if (v !== inp.value) inp.value = v; }
        r.topBoard[k] = v; saveSoon();
      });
    } else {
      inp.addEventListener('input', function(){
        var r = getReview(curDate);
        if (scope === 'r') setByPath(r, inp.dataset.k, inp.value);
        else if (scope === 'arr') r[inp.dataset.arr][+inp.dataset.i][inp.dataset.f] = inp.value;
        saveSoon();
      });
    }
  });
}

/* ============================================================
   高标池（选股 tab 顶部）
   ============================================================ */
function buildTopBoardPool(){
  var cutoff = dateMinusDays(todayStr(), 29);
  var map = {};
  Object.keys(S.reviews || {}).forEach(function(d){
    if (d < cutoff) return;
    var r = S.reviews[d]; if (!r) return;
    var tb = normalizeTopBoard(r.topBoard);
    var name = (tb.name || '').trim(); if (!name) return;
    var b = parseInt(tb.boards, 10); if (!isFinite(b) || b <= 0) return;
    var days = parseInt(tb.days, 10); if (!isFinite(days) || days < 0) days = 0;
    if (!map[name]) map[name] = { name:name, maxBoards:b, bestDate:d, bestDays:days, history:[] };
    var item = map[name];
    item.history.push({ date:d, boards:b, days:days });
    if (b > item.maxBoards) { item.maxBoards = b; item.bestDate = d; item.bestDays = days; }
    else if (b === item.maxBoards && d > item.bestDate) { item.bestDate = d; item.bestDays = days; }
  });
  var list = Object.keys(map).map(function(k){ return map[k]; });
  list.forEach(function(item){ item.history.sort(function(a, b){ return b.date.localeCompare(a.date); }); });
  list.sort(function(a, b){
    if (b.maxBoards !== a.maxBoards) return b.maxBoards - a.maxBoards;
    return b.bestDate.localeCompare(a.bestDate);
  });
  return list.slice(0, 20);
}
function renderTopBoardPoolCard(){
  var list = buildTopBoardPool();
  if (!list.length) return '<div class="card"><div class="card-title">高标池</div><div class="hint">还没有高标记录，到每日复盘的连板梯队里填写</div></div>';
  var rows = list.map(function(item){
    return '<div class="top-pool-row" onclick="openTopPoolDetail(\'' + esc(item.name).replace(/'/g,"\\'") + '\')">' +
      '<span class="top-pool-name">' + esc(item.name) + '</span>' +
      '<span class="top-pool-meta"><b>' + item.maxBoards + '板</b> · ' + formatMD(item.bestDate) + '</span></div>';
  }).join('');
  return '<div class="card"><div class="card-title">高标池</div>' + rows + '</div>';
}
window.openTopPoolDetail = function(name){
  var list = buildTopBoardPool();
  var item = null;
  for (var i = 0; i < list.length; i++) if (list[i].name === name) { item = list[i]; break; }
  if (!item) return;
  var rows = item.history.map(function(h){
    var hText = (h.days > 0 ? h.days + '天' : '') + h.boards + '板';
    return '<div class="pool-history-row"><span class="pool-history-date">' + esc(h.date) + '</span><span class="pool-history-h">' + esc(hText) + '</span></div>';
  }).join('');
  openSheet('<div class="sheet-title">' + esc(item.name) + '</div><div class="sheet-desc">最高 ' + item.maxBoards + '板 · ' + esc(item.bestDate) + '</div>' + rows);
};

window.openPickSheet = function(id){

function drawPickSheet(){
  var p = pickDraft;
  var isNew = !S.picks.some(function(x){ return x.id === p.id; });
  openSheet('<div class="sheet-title">' + (isNew ? '新建选股' : '编辑选股') + '</div>' +
    '<div class="frow"><label>日期</label><input type="date" id="f-date" value="' + esc(p.date) + '"></div>' +
    '<div class="frow"><label>名称</label><input id="f-name" value="' + esc(p.name) + '" placeholder="股票名称"></div>' +
    '<div class="sub-label">分析原因</div>' +
    '<div id="reason-list">' +
      p.reasons.map(function(r,i){
        return '<div class="dynrow">' +
          '<select class="sel" data-ri="' + i + '" data-rf="dim">' +
            DIMS.map(function(d){ return '<option ' + (d === r.dim ? 'selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' +
          '<input class="grow" data-ri="' + i + '" data-rf="text" value="' + esc(r.text) + '" placeholder="原因描述">' +
          '<button class="del" data-rdel="' + i + '">✕</button></div>';
      }).join('') + '</div>' +
    '<button class="addrow" id="add-reason">+ 添加维度</button>' +
    '<div class="frow"><label>预期</label><input id="f-expect" value="' + esc(p.expect) + '" placeholder="目标价 / 持有周期"></div>' +
    '<div class="frow"><label>状态</label><select id="f-status">' +
      ['观察','买入','放弃'].map(function(s){ return '<option ' + (s === p.status ? 'selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    '<button class="btn-primary" id="f-save">保存</button>' +
    (isNew ? '' : '<button class="btn-danger" id="f-del">删除</button>'));
  var sh = $('#sheet');
  function bind(id, key){
    var el = $('#' + id);
    if (el) el.addEventListener('input', function(){ pickDraft[key] = el.value; });
  }
  bind('f-date','date'); bind('f-name','name'); bind('f-expect','expect'); bind('f-status','status');
  $$('[data-ri]', sh).forEach(function(el){
    var h = function(){ pickDraft.reasons[+el.dataset.ri][el.dataset.rf] = el.value; };
    el.addEventListener('input', h); el.addEventListener('change', h);
  });
  $$('[data-rdel]', sh).forEach(function(b){
    b.onclick = function(){
      pickDraft.reasons.splice(+b.dataset.rdel, 1);
      if (!pickDraft.reasons.length) pickDraft.reasons.push({ dim:'技术面', text:'' });
      drawPickSheet();
    };
  });
  $('#add-reason').onclick = function(){ pickDraft.reasons.push({ dim:'题材面', text:'' }); drawPickSheet(); };
  $('#f-save').onclick = function(){
    if (!pickDraft.name.trim()) return;
    var i = S.picks.findIndex(function(x){ return x.id === pickDraft.id; });
    if (i >= 0) S.picks[i] = pickDraft; else S.picks.unshift(pickDraft);
    save(); closeSheet(); render();
  };

/* 按股票统计：胜率 / 盈亏比 / 期望值 / 最大回撤 等 */
function calcGroupStats(filterFn){
  var allGroups = aggregateList(S.trades);
  var filtered = allGroups.filter(filterFn || function(){ return true; });
  var closed = filtered.filter(function(g){ return g.status === 'closed' && g.everHeld; });
  var n = closed.length;
  var wins = closed.filter(function(g){ return g.realizedPnl > 0; });
  var losses = closed.filter(function(g){ return g.realizedPnl < 0; });
  var winCount = wins.length, lossCount = losses.length;
  var totalWin = wins.reduce(function(s, g){ return s + g.realizedPnl; }, 0);
  var totalLoss = losses.reduce(function(s, g){ return s + g.realizedPnl; }, 0);
  var cum = totalWin + totalLoss;
  var peak = 0, maxDD = 0;
  var sorted = closed.slice().sort(function(a, b){ return (a.lastSellDate || '').localeCompare(b.lastSellDate || ''); });
  var running = 0, maxConsecLosses = 0, curStreak = 0;
  sorted.forEach(function(g){
    running += g.realizedPnl;
    if (running > peak) peak = running;
    if (running - peak < maxDD) maxDD = running - peak;
    if (g.realizedPnl < 0) { curStreak++; if (curStreak > maxConsecLosses) maxConsecLosses = curStreak; }
    else if (g.realizedPnl > 0) curStreak = 0;
  });
  var avgWin = winCount ? totalWin / winCount : 0;
  var avgLoss = lossCount ? totalLoss / lossCount : 0;
  var plRatio = (avgLoss < 0) ? (avgWin / Math.abs(avgLoss)) : (avgWin > 0 ? Infinity : 0);
  var expectancy = n ? cum / n : 0;
  var winRate = n ? winCount / n : 0;
  var avgHoldingDays = n ? closed.reduce(function(s, g){ return s + g.holdingDays; }, 0) / n : 0;
  return { n:n, winRate:winRate, winCount:winCount, lossCount:lossCount, total:cum, maxDD:maxDD,
    maxConsecLosses:maxConsecLosses, avgWin:avgWin, avgLoss:avgLoss, plRatio:plRatio,
    expectancy:expectancy, avgHoldingDays:avgHoldingDays, closedGroups:sorted };
}
function fmtPLRatio(v){ if (!isFinite(v)) return '∞'; if (v === 0) return '—'; return v.toFixed(2); }
function statsBox(label, st){
  return '<div class="stat-box"><div class="stat-box-title">' + esc(label) + '</div>' +
    '<div class="stat-box-num">' + st.n + '<span style="font-size:11px;color:var(--text2);font-weight:500;margin-left:3px">只</span></div>' +
    '<div class="stat-box-row"><span>胜率</span><span>' + (st.n ? Math.round(st.winRate*100) + '%' : '—') + '</span></div>' +
    '<div class="stat-box-row"><span>最大回撤</span><span class="' + (st.maxDD < 0 ? 'down' : '') + '">' + (st.maxDD < 0 ? fmtNum(st.maxDD) : '—') + '</span></div></div>';
}
function renderStatsCard(){
  var inPlan = calcGroupStats(function(g){ return !g.hasUnplanned; });
  var outPlan = calcGroupStats(function(g){ return g.hasUnplanned; });
  var inMode = calcGroupStats(function(g){ return g.firstModeId && g.firstModeId !== 'outside'; });
  var outMode = calcGroupStats(function(g){ return !g.firstModeId || g.firstModeId === 'outside'; });
  return '<div class="card"><div class="card-title">计划 · 模式 统计（按已清仓股票）</div>' +
    '<div class="stat-grid" style="margin-top:8px">' + statsBox('计划内', inPlan) + statsBox('计划外', outPlan) + '</div>' +
    '<div class="stat-grid">' + statsBox('模式内', inMode) + statsBox('模式外', outMode) + '</div></div>';
}
function renderOverallStatsCard(filterFn){
  var st = calcGroupStats(filterFn);
  if (!st.n) return '';
  return '<div class="card"><div class="card-title">总体统计</div>' +
    '<div class="overall-stats">' +

      '<div class="o-item"><span class="o-num ' + (st.total >= 0 ? 'up' : 'down') + '">' + (st.total >= 0 ? '+' : '') + fmtNum(st.total) + '</span><span class="o-lbl">累计盈亏</span></div>' +
      '<div class="o-item"><span class="o-num">' + Math.round(st.winRate*100) + '%</span><span class="o-lbl">胜率</span></div>' +
      '<div class="o-item"><span class="o-num">' + fmtPLRatio(st.plRatio) + '</span><span class="o-lbl">盈亏比</span></div>' +
      '<div class="o-item"><span class="o-num ' + (st.expectancy >= 0 ? 'up' : 'down') + '">' + (st.expectancy >= 0 ? '+' : '') + fmtNum(st.expectancy) + '</span><span class="o-lbl">期望值/笔</span></div>' +
      '<div class="o-item"><span class="o-num">' + st.avgHoldingDays.toFixed(1) + '</span><span class="o-lbl">平均持仓天</span></div>' +

function renderSummaryView(){

    var avgCostText = g.holdQty > 0 ? fmtNum(g.avgCost) : '—';
    var pnlCls = g.realizedPnl >= 0 ? 'up' : 'down';
    var badges = [];
    if (g.hasUnplanned) badges.push('<span class="badge badge-orange">计划外</span>');
    if (g.firstModeName) badges.push('<span class="badge badge-blue">' + esc(g.firstModeName) + '</span>');
    else badges.push('<span class="badge badge-gray">模式外</span>');
    badges.push('<span class="sum-status ' + statusCls + '">' + statusText + '</span>');
    var warns = '';
    if (g.warnings && g.warnings.length) warns = '<div class="sum-warn">⚠ ' + g.warnings.map(function(w){ return esc(w); }).join('；') + '</div>';
    var opsHtml = g.ops.map(function(op){
      return '<div class="sum-op-row"><span class="sum-op-dir ' + op.dir + '">' + (op.dir === 'buy' ? '买' : '卖') + '</span>' +
        '<span class="sum-op-date">' + esc(op.date.slice(5)) + '</span>' +

    return '<div class="card"><div class="sum-head"><span class="stock-name">' + esc(g.name) + '</span>' +
        '<div class="sum-badges">' + badges.join('') + '</div></div>' +
      '<div class="sum-meta">' + meta + '</div>' +
      '<div class="sum-grid">' +
        '<div><span class="g-num">' + g.totalBuyQty + '</span><span class="g-lbl">累计买入</span></div>' +
        '<div><span class="g-num">' + g.totalSellQty + '</span><span class="g-lbl">累计卖出</span></div>' +
        '<div><span class="g-num">' + g.holdQty + '</span><span class="g-lbl">剩余</span></div></div>' +
      '<div class="sum-row"><span class="k">平均成本</span><span class="v">' + avgCostText + '</span></div>' +
      '<div class="sum-row"><span class="k">已实现盈亏</span><span class="v ' + pnlCls + '">' + (g.realizedPnl >= 0 ? '+' : '') + fmtNum(g.realizedPnl) + '</span></div>' +
      warns + '<div class="sum-ops">' + opsHtml + '</div></div>';
  }).join('');
}

  var dirSelector = '<div class="frow"><label>方向</label>' +

   交易模式 · 模式统计 / 卡片 / 对比

function modeStats(modeId){
  var allGroups = aggregateList(S.trades);
  var myGroups = allGroups.filter(function(g){ return g.firstModeId === modeId; });
  var closed = myGroups.filter(function(g){ return g.status === 'closed' && g.everHeld; })
                       .sort(function(a, b){ return (a.lastSellDate || '').localeCompare(b.lastSellDate || ''); });
  var n = closed.length;
  var wins = closed.filter(function(g){ return g.realizedPnl > 0; });
  var losses = closed.filter(function(g){ return g.realizedPnl < 0; });
  var winCount = wins.length, lossCount = losses.length;
  var totalWin = wins.reduce(function(s, g){ return s + g.realizedPnl; }, 0);
  var totalLoss = losses.reduce(function(s, g){ return s + g.realizedPnl; }, 0);
  var cum = totalWin + totalLoss;
  var peak = 0, maxDD = 0;
  var curve = [0], pnls = [];
  var maxConsecLosses = 0, curStreak = 0;
  var running = 0;
  closed.forEach(function(g){
    var p = g.realizedPnl;
    pnls.push(p); running += p; curve.push(running);
    if (running > peak) peak = running;
    if (running - peak < maxDD) maxDD = running - peak;
    if (p < 0) { curStreak++; if (curStreak > maxConsecLosses) maxConsecLosses = curStreak; }
    else if (p > 0) curStreak = 0;
  });
  var avgWin = winCount ? totalWin / winCount : 0;
  var avgLoss = lossCount ? totalLoss / lossCount : 0;
  var plRatio = (avgLoss < 0) ? (avgWin / Math.abs(avgLoss)) : (avgWin > 0 ? Infinity : 0);
  var expectancy = n ? cum / n : 0;
  var winRate = n ? winCount / n : 0;
  var avgHoldingDays = n ? closed.reduce(function(s, g){ return s + g.holdingDays; }, 0) / n : 0;
  var byEnv = {};
  closed.forEach(function(g){
    var env = getEnvOfDate(g.firstBuyDate) || '未标记';
    if (!byEnv[env]) byEnv[env] = { n:0, wins:0, total:0, peak:0, maxDD:0 };
    var e = byEnv[env];
    e.n++; if (g.realizedPnl > 0) e.wins++;
    e.total += g.realizedPnl;
    if (e.total > e.peak) e.peak = e.total;
    if (e.total - e.peak < e.maxDD) e.maxDD = e.total - e.peak;
  });
  return { n:n, winRate:winRate, winCount:winCount, lossCount:lossCount, total:cum, maxDD:maxDD,
    maxConsecLosses:maxConsecLosses, avgWin:avgWin, avgLoss:avgLoss, plRatio:plRatio,
    expectancy:expectancy, avgHoldingDays:avgHoldingDays, curve:curve, pnls:pnls, byEnv:byEnv, closedGroups:closed };
}

function pnlBars(pnls){
  if (!pnls || !pnls.length) return '';

  var W = 320, H = 44, mid = H/2, n = pnls.length, gap = 3;

  html += '<line x1="0" y1="' + mid + '" x2="' + W + '" y2="' + mid + '" stroke="var(--sep)" stroke-width="1"/>';
  pnls.forEach(function(p, i){

function smoothPath(pts){
  if (pts.length < 2) return '';
  var d = 'M' + pts[0].x.toFixed(2) + ',' + pts[0].y.toFixed(2);
  for (var i = 0; i < pts.length - 1; i++) {
    var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ' C' + c1x.toFixed(2) + ',' + c1y.toFixed(2) + ' ' + c2x.toFixed(2) + ',' + c2y.toFixed(2) + ' ' + p2.x.toFixed(2) + ',' + p2.y.toFixed(2);
  }
  return d;
}
function sparklineBig(curve){

  var peakPts = peaks.map(function(v, i){ return { x: P + i * (W - 2 * P) / (curve.length - 1), y: H - P - ((v - min) / range) * (H - 2 * P) }; });
  var line = smoothPath(pts), peakLine = smoothPath(peakPts);

  for (var i = pts.length - 2; i >= 0; i--) ddArea += ' L' + pts[i].x.toFixed(2) + ',' + pts[i].y.toFixed(2);
