    '</defs>' +
    (zeroY > 0 && zeroY < H ? '<line x1="0" y1="' + zeroY.toFixed(2) + '" x2="' + W + '" y2="' + zeroY.toFixed(2) + '" stroke="var(--sep)" stroke-width="1" stroke-dasharray="3 4"/>' : '') +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + ddArea + '" fill="url(#' + gidDD + ')"/>' +
    '<path d="' + peakLine + '" fill="none" stroke="rgba(255,59,48,.5)" stroke-width="1.2" stroke-dasharray="3 3"/>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + pts[pts.length-1].x.toFixed(2) + '" cy="' + pts[pts.length-1].y.toFixed(2) + '" r="3" fill="' + color + '"/>' +
    '<text x="' + (W - 4) + '" y="14" text-anchor="end" font-size="10" fill="var(--text3)">最大 ' + (maxVal >= 0 ? '+' : '') + fmtNum(maxVal) + '</text>' +
    '<text x="' + (W - 4) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10" fill="var(--text3)">' + (lastVal >= 0 ? '+' : '') + fmtNum(lastVal) + '</text></svg>';

function winRateTrend(closedGroups, windowSize){
  if (!closedGroups || closedGroups.length < 2) return '<div class="chart-empty">需要至少 2 只已清仓股票</div>';

    '<div class="block"><label>止损</label><textarea id="m-stop" rows="2">' + esc(m.stop) + '</textarea></div>' +
    '<button class="btn-primary" id="m-save">保存</button>' +
    (isNew ? '' : '<button class="btn-danger" id="m-del">删除</button>'));

        else { b.style.background = ''; b.style.color = ''; }

    if (!modeDraft.name.trim()) return;

    save(); closeSheet(); render();
  };
  var del = $('#m-del');

    var id = modeDraft.id;

    if (affected > 0) msg += '\n\n有 ' + affected + ' 只股票的首笔买入记录关联此模式。';
    if (!confirm(msg)) return;
    S.modes = S.modes.filter(function(x){ return x.id !== id; });
    var ci = compareModeIds.indexOf(id); if (ci >= 0) compareModeIds.splice(ci, 1);
    save(); closeSheet(); render();
  };
}

  $('#btn-export').onclick = exportData;

  $('#btn-rules').onclick = function(){ closeSheet(); openRuleManager('builtin'); };
  $('#btn-reset').onclick = resetData;
}
function exportData(){
  try {
    var json = JSON.stringify(S, null, 2);
    var blob = new Blob([json], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '复盘数据_v' + (S.dataVersion || CURRENT_VERSION) + '_' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    flashSaved(); closeSheet();
  } catch(e) { alert('导出失败：' + (e.message || e)); }
}
function importData(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = function(e){
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var data;
      try { data = JSON.parse(ev.target.result); } catch(err) { alert('文件不是有效的 JSON 格式'); return; }
      var errors = validateImportData(data);
      if (errors.length) { alert('导入文件校验失败：\n\n· ' + errors.slice(0, 6).join('\n· ')); return; }
      if (!confirm('导入将覆盖当前所有数据，确定吗？')) return;
      try { data = migrate(data); S = data; save(); closeSheet(); render(); alert('导入成功'); }
      catch(err) { alert('导入失败：' + (err.message || err)); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetData(){
  if (!confirm('确定清空所有数据？')) return;
  if (!confirm('再次确认：所有数据都会被删除，且无法恢复。')) return;
  S = freshState(); save(); closeSheet(); render();
  alert('已清空（会重新生成模拟数据）');
}

  document.body.appendChild(overlay);

/* ============================================================
   复盘总览 · 交易统计（简化聚合，供规则上下文用）
   ============================================================ */
function aggregateTradesSimple(trades){
  var groups = {};
  trades.forEach(function(t){
    var name = (t.name||'').trim(); if (!name) return;
    if (!groups[name]) groups[name] = { name:name, ops:[], hasUnplanned:false };
    var g = groups[name];
    if (t.inPlan === false) g.hasUnplanned = true;
    if (t.buyPrice) g.ops.push({ date:t.date, dir:'buy', price:parseFloat(t.buyPrice)||0, qty:parseFloat(t.qty)||0 });
    if (t.sellPrice) g.ops.push({ date:t.date, dir:'sell', price:parseFloat(t.sellPrice)||0, qty:parseFloat(t.qty)||0 });
  });
  var list = [];
  Object.keys(groups).forEach(function(name){
    var g = groups[name];
    g.ops.sort(function(a,b){
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return a.dir === 'buy' ? -1 : 1;
    });
    var holdQty=0, holdCost=0, pnl=0, firstBuy=null, lastSell=null;
    g.ops.forEach(function(op){
      if (op.dir === 'buy') { holdQty += op.qty; holdCost += op.price * op.qty; if (!firstBuy) firstBuy = op.date; }
      else {
        if (holdQty <= 0) return;
        var sq = Math.min(op.qty, holdQty);
        var avg = holdCost / holdQty;
        pnl += (op.price - avg) * sq;
        holdQty -= sq; holdCost -= avg * sq; lastSell = op.date;
      }
    });
    list.push({ name:name, status: holdQty>0?'holding':'closed', realizedPnl:pnl,
      firstBuyDate:firstBuy, lastSellDate:lastSell, everHeld:!!firstBuy, hasUnplanned:g.hasUnplanned });
  });
  return list;
}
function calcTradeStats(trades){
  var groups = aggregateTradesSimple(trades || []);
  var closed = groups.filter(function(g){ return g.status === 'closed' && g.everHeld; });
  var sorted = closed.slice().sort(function(a,b){ return (a.lastSellDate||'').localeCompare(b.lastSellDate||''); });
  var n = closed.length;
  var wins = closed.filter(function(g){ return g.realizedPnl > 0; });
  var losses = closed.filter(function(g){ return g.realizedPnl < 0; });
  var total = closed.reduce(function(s,g){ return s + g.realizedPnl; }, 0);
  var totalWin = wins.reduce(function(s,g){ return s + g.realizedPnl; }, 0);
  var totalLoss = losses.reduce(function(s,g){ return s + g.realizedPnl; }, 0);
  var avgWin = wins.length ? totalWin / wins.length : 0;
  var avgLoss = losses.length ? totalLoss / losses.length : 0;
  var plRatio = (avgLoss < 0) ? (avgWin / Math.abs(avgLoss)) : (avgWin > 0 ? Infinity : 0);
  var expectancy = n ? total / n : 0;
  var winRate = n ? wins.length / n : 0;
  var peak=0, maxDD=0, running=0, curStreak=0, maxConsecLoss=0;
  sorted.forEach(function(g){
    running += g.realizedPnl;
    if (running > peak) peak = running;
    if (running - peak < maxDD) maxDD = running - peak;
    if (g.realizedPnl < 0) { curStreak++; if (curStreak > maxConsecLoss) maxConsecLoss = curStreak; }
    else if (g.realizedPnl > 0) curStreak = 0;
  });
  function recent(k){
    var r = sorted.slice().reverse().slice(0, k);
    var t = r.reduce(function(s,g){ return s+g.realizedPnl; }, 0);
    var w = r.filter(function(g){ return g.realizedPnl > 0; }).length;
    var l = r.filter(function(g){ return g.realizedPnl < 0; }).length;
    var u = r.filter(function(g){ return g.hasUnplanned; }).length;
    return { total:t, winRate: r.length ? (w/r.length)*100 : 0, lossCount:l, unplannedCount:u };
  }
  var r3 = recent(3), r5 = recent(5), r10 = recent(10);
  return {
    closedCount: n,
    overallWinRate: Math.round(winRate * 1000) / 10,
    overallTotalPnl: Math.round(total * 100) / 100,
    overallMaxDD: Math.round(maxDD * 100) / 100,
    overallPlRatio: isFinite(plRatio) ? Math.round(plRatio * 100) / 100 : 0,
    overallExpectancy: Math.round(expectancy * 100) / 100,
    overallMaxConsecLoss: maxConsecLoss,
    r3TotalPnl: Math.round(r3.total*100)/100, r3WinRate: Math.round(r3.winRate*10)/10,
    r3LossCount: r3.lossCount, r3UnplannedCount: r3.unplannedCount,
    r5TotalPnl: Math.round(r5.total*100)/100, r5WinRate: Math.round(r5.winRate*10)/10,
    r5LossCount: r5.lossCount, r5UnplannedCount: r5.unplannedCount,
    r10TotalPnl: Math.round(r10.total*100)/100, r10WinRate: Math.round(r10.winRate*10)/10,
    r10LossCount: r10.lossCount, r10UnplannedCount: r10.unplannedCount
  };
}

function buildRuleContext(){
  var today = S.reviews[curDate] || {};
  var yd = dateMinusDays(curDate, 1);
  var yesterday = S.reviews[yd] || {};
  var dirs = S.lines.directions || [];
  var mainDir = null;
  dirs.forEach(function(d){
    if (d.importance === 'main') {
      mainDir = {
        cycle: (d.history[curDate] && d.history[curDate].cycle) || '',
        yesterdayCycle: (d.history[yd] && d.history[yd].cycle) || ''
      };
    }
  });
  var dirCtx = dirs.map(function(d){
    return {
      id:d.id, name:d.name,
      todayImportance: d.importance,
      yesterdayImportance: d.importance,
      todayCycle: (d.history[curDate] && d.history[curDate].cycle) || '',
      yesterdayCycle: (d.history[yd] && d.history[yd].cycle) || '',
      branches: d.branches || []
    };
  });
  var bc = today.boardCounts || {};
  var ctx = {
    sentiment: today.sentiment || '',
    yesterdaySentiment: yesterday.sentiment || '',
    marketPhase: today.marketPhase || '',
    yesterdayPhase: yesterday.marketPhase || '',
    limitUp: today.limitUp || '', yesterdayLimitUp: yesterday.limitUp || '',
    limitDown: today.limitDown || '', yesterdayLimitDown: yesterday.limitDown || '',
    maxBoard: today.maxBoard || '', yesterdayMaxBoard: yesterday.maxBoard || '',
    yesterdayPremium: today.yesterdayPremium || '',
    firstBoardCount: (today.firstBoard && today.firstBoard.count) || '',
    b6: bc.b6 || '', b5: bc.b5 || '', b4: bc.b4 || '', b3: bc.b3 || '', b2: bc.b2 || '',
    boardCounts: today.boardCounts || {},
    yesterdayBoardCounts: yesterday.boardCounts || {},
    mainDirectionCycle: mainDir ? mainDir.cycle : '',
    directions: dirCtx,
    trades: S.trades || []
  };
  var ts = calcTradeStats(S.trades || []);
  Object.keys(ts).forEach(function(k){ ctx[k] = ts[k]; });
  return ctx;
}
function evalCondition(cond, ctx){
  var v = ctx[cond.field];
  var def = getFieldDef(cond.field); if (!def) return false;
  if (def.type === 'enum') {
    var s = String(v == null ? '' : v), t = String(cond.value == null ? '' : cond.value);
    if (cond.op === 'eq') return s === t;
    if (cond.op === 'neq') return s !== t;
    return false;
  } else {
    var a = parseFloat(v), b = parseFloat(cond.value);
    if (!isFinite(a) || !isFinite(b)) return false;
    if (cond.op === 'eq') return a === b;
    if (cond.op === 'gte') return a >= b;
    if (cond.op === 'lte') return a <= b;
    if (cond.op === 'gt') return a > b;
    if (cond.op === 'lt') return a < b;
    return false;
  }
}
function evalCustomRule(rule, ctx){
  if (!rule.conditions || !rule.conditions.length) return false;
  for (var i=0; i<rule.conditions.length; i++) if (!evalCondition(rule.conditions[i], ctx)) return false;
  return true;
}
/* 运行所有规则，按风险/机会分组，各取前 4 条 */
function runRules(){
  var ctx = buildRuleContext();
  var warns = [], goods = [];
  RULES.forEach(function(r){
    var st = ruleSettings.builtin[r.id];
    if (!st || st.deleted || !st.enabled) return;
    var ok = false; try { ok = r.check(ctx); } catch(e){}
    if (!ok) return;
    var item = { id:r.id, group:r.group, level:r.level, star:r.star, text: st.text || r.defaultText };
    if (r.level === 'warn') warns.push(item);
    else if (r.level === 'good') goods.push(item);
  });
  ruleSettings.custom.forEach(function(cr){
    if (!cr.enabled) return;
    var ok = false; try { ok = evalCustomRule(cr, ctx); } catch(e){}
    if (!ok) return;
    var item = { id:cr.id, group:'Z', level: cr.level || 'info', star:false, text: cr.text || '' };
    if (item.level === 'warn') warns.push(item);
    else if (item.level === 'good') goods.push(item);
  });
  function weight(x){ if (x.group === 'G') return 100; if (x.star) return 80; return 50; }
  warns.sort(function(a, b){ var wa=weight(a), wb=weight(b); if (wa!==wb) return wb-wa; return String(a.id).localeCompare(String(b.id)); });
  goods.sort(function(a, b){ var wa=weight(a), wb=weight(b); if (wa!==wb) return wb-wa; return String(a.id).localeCompare(String(b.id)); });
  return { warns: warns.slice(0, 4), goods: goods.slice(0, 4) };
}

/* ============================================================
   复盘总览 · 关键变化计算
   ============================================================ */
function getChangeItems(today, yesterday){
  var items = [];
  var tS = today.sentiment, yS = yesterday.sentiment;
  if (tS && yS && tS !== yS) {
    var ia = SENT_ORDER.indexOf(yS), ib = SENT_ORDER.indexOf(tS);
    items.push({ label:'情绪', from: tagLabel('sentiment', yS), to: tagLabel('sentiment', tS),
      dir: ib > ia ? 'up' : 'down', desc: ib > ia ? '赚钱效应回暖' : '赚钱效应转差', color: tagColorOf('sentiment', tS) });
  }
  var tP = today.marketPhase, yP = yesterday.marketPhase;
  if (tP && yP && tP !== yP) {
    var ia2 = PHASE_ORDER.indexOf(yP), ib2 = PHASE_ORDER.indexOf(tP);
    items.push({ label:'阶段', from: tagLabel('marketPhase', yP), to: tagLabel('marketPhase', tP),
      dir: ib2 > ia2 ? 'up' : 'down', desc: ib2 > ia2 ? '大盘转强' : '大盘转弱', color: tagColorOf('marketPhase', tP) });
  }
  var tU = parseInt(today.limitUp,10), yU = parseInt(yesterday.limitUp,10);
  if (isFinite(tU) && isFinite(yU) && tU !== yU) items.push({ label:'涨停', from:yU, to:tU, dir: tU > yU ? 'up' : 'down', desc: tU > yU ? '家数放大' : '家数萎缩', color:null });
  var tD = parseInt(today.limitDown,10), yD = parseInt(yesterday.limitDown,10);
  if (isFinite(tD) && isFinite(yD) && tD !== yD) items.push({ label:'跌停', from:yD, to:tD, dir: tD > yD ? 'up' : 'down', desc: tD > yD ? '恐慌加剧' : '恐慌缓解', color:null });
  var tM = parseInt(today.maxBoard,10), yM = parseInt(yesterday.maxBoard,10);
  if (isFinite(tM) && isFinite(yM) && tM !== yM) items.push({ label:'最高板', from:yM, to:tM, dir: tM > yM ? 'up' : 'down', desc: tM > yM ? '高度打开' : '高度压制', color:null });
  return items;
}
function tagLabel(g, id){ var o = getTag(g, id); return o ? o.name : id; }
function tagColorOf(g, id){ var o = getTag(g, id); return o ? o.color : ''; }

function renderCoreMain(dirs){

function renderSideLines(dirs){

/* 规则管理事件绑定 */
function bindRuleManagerEvents(){
  // 内置：开关
  $$('[data-rule-toggle]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.ruleToggle;
      if (!ruleSettings.builtin[id]) {
        var r = RULES.find(function(x){ return x.id === id; });
        ruleSettings.builtin[id] = { enabled: r.on, text: r.defaultText, deleted: false };
      }
      ruleSettings.builtin[id].enabled = !ruleSettings.builtin[id].enabled;
      b.classList.toggle('on', ruleSettings.builtin[id].enabled);
      saveRuleSettings();
    };
  });
  // 内置：改文案
  $$('[data-rule-text]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var id = inp.dataset.ruleText;
      if (!ruleSettings.builtin[id]) {
        var r = RULES.find(function(x){ return x.id === id; });
        ruleSettings.builtin[id] = { enabled: r.on, text: r.defaultText, deleted: false };
      }
      ruleSettings.builtin[id].text = inp.value;
      var label = $('#rgtxt_' + id);
      if (label) label.textContent = inp.value;
      saveRuleSettings();
    });
  });
  // 内置：删除（自定义确认弹窗）
  $$('[data-rule-del]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.ruleDel;
      customConfirm('删除内置规则 ' + id + '？\n可在底部「恢复所有已删除」找回。', function(){
        if (!ruleSettings.builtin[id]) {
          var r = RULES.find(function(x){ return x.id === id; });
          ruleSettings.builtin[id] = { enabled: r.on, text: r.defaultText, deleted: false };
        }
        ruleSettings.builtin[id].deleted = true;
        saveRuleSettings(); renderRuleManager();
      }, { okText: '删除', danger: true });
    };
  });
  // 内置：恢复默认文案
  $$('[data-rule-reset]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.ruleReset;
      var r = RULES.find(function(x){ return x.id === id; }); if (!r) return;
      if (!ruleSettings.builtin[id]) ruleSettings.builtin[id] = { enabled: r.on, text: r.defaultText, deleted: false };
      ruleSettings.builtin[id].text = r.defaultText;
      var inp = $('[data-rule-text="' + id + '"]'); if (inp) inp.value = r.defaultText;
      var label = $('#rgtxt_' + id); if (label) label.textContent = r.defaultText;
      saveRuleSettings();
    };
  });
  // 自定义：开关
  $$('[data-cr-toggle]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crToggle;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      cr.enabled = !cr.enabled;
      b.classList.toggle('on', cr.enabled);
      saveRuleSettings();
    };
  });
  // 自定义：编辑 / 收起
  $$('[data-cr-edit]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crEdit;
      customEditingId = (customEditingId === id) ? null : id;
      renderRuleManager();
    };
  });
  // 自定义：删除（自定义确认弹窗）
  $$('[data-cr-del]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crDel;
      customConfirm('删除这条自定义规则？', function(){
        ruleSettings.custom = ruleSettings.custom.filter(function(x){ return x.id !== id; });
        saveRuleSettings(); renderRuleManager();
      }, { okText: '删除', danger: true });
    };
  });
  // 自定义：条件行变化
  $$('[data-cr-cond-field]').forEach(function(el){
    var h = function(){
      var id = el.dataset.crCondField;
      var i = parseInt(el.dataset.crCondI, 10);
      var key = el.dataset.crKey;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; });
      if (!cr || !cr.conditions[i]) return;
      cr.conditions[i][key] = el.value;
      // 字段切换时，重置 op 和 value
      if (key === 'field') {
        var fd = getFieldDef(el.value);
        var ops = fd && fd.type === 'enum' ? OPS_ENUM : OPS_NUM;
        cr.conditions[i].op = ops[0].id;
        cr.conditions[i].value = '';
        saveRuleSettings(); renderRuleManager(); return;
      }
      saveRuleSettings();
    };
    el.addEventListener('change', h);
    if (el.tagName === 'INPUT') el.addEventListener('input', h);
  });
  // 自定义：删除条件
  $$('[data-cr-cond-del]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crCondDel;
      var i = parseInt(b.dataset.crCondI, 10);
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      if (cr.conditions.length <= 1) { alert('至少保留一个条件'); return; }
      cr.conditions.splice(i, 1);
      saveRuleSettings(); renderRuleManager();
    };
  });
  // 自定义：新增条件
  $$('[data-cr-addcond]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crAddcond;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      cr.conditions.push({ field:'sentiment', op:'eq', value:'' });
      saveRuleSettings(); renderRuleManager();
    };
  });
  // 自定义：切换级别
  $$('[data-cr-setlevel]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crSetlevel;
      var lv = b.dataset.crLv;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      cr.level = lv;
      saveRuleSettings(); renderRuleManager();
    };
  });
  // 自定义：文案输入
  $$('[data-cr-text]').forEach(function(el){
    el.addEventListener('input', function(){
      var id = el.dataset.crText;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      cr.text = el.value;
      saveRuleSettings();
    });
  });
  // 自定义：保存
  $$('[data-cr-save]').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.crSave;
      var cr = ruleSettings.custom.find(function(x){ return x.id === id; }); if (!cr) return;
      if (!cr.text || !cr.text.trim()) { alert('请填写提示文案'); return; }
      if (!cr.conditions.length) { alert('至少添加一个条件'); return; }
      for (var i=0;i<cr.conditions.length;i++) if (!cr.conditions[i].value) { alert('第 ' + (i+1) + ' 个条件未填值'); return; }
      customEditingId = null;
      saveRuleSettings(); renderRuleManager();
    };
  });
  // 自定义：取消
  $$('[data-cr-cancel]').forEach(function(b){
    b.onclick = function(){ customEditingId = null; renderRuleManager(); };
  });
}
function addCustomRule(){
  var newRule = { id:'c_' + uid(), level:'info', text:'', enabled:true, conditions: [{ field:'sentiment', op:'eq', value:'' }] };
  ruleSettings.custom.push(newRule);
  saveRuleSettings();
  customEditingId = newRule.id;
  renderRuleManager();
}
function restoreAllDeleted(){
  RULES.forEach(function(r){
    var st = ruleSettings.builtin[r.id];
    if (st && st.deleted) st.deleted = false;
  });
  saveRuleSettings(); renderRuleManager();
}

/* ============================================================
   主渲染 & Tab 切换
   ============================================================ */
var tab = 'review';
var TITLES = { review:'每日复盘', picks:'选股', trades:'交易复盘', modes:'交易模式' };
function render(){
  var view = $('#view');
  $('#pageTitle').textContent = TITLES[tab];
  var sub = '';
  if (tab === 'review') sub = curDate;
  else if (tab === 'picks') sub = '共 ' + S.picks.length + ' 条记录';
  else if (tab === 'trades') sub = '共 ' + S.trades.length + ' 笔操作';
  else sub = '共 ' + S.modes.length + ' 个模式';
  $('#pageSub').textContent = sub;
  $('#fab').hidden = (tab === 'review');
  if (tab === 'review') { view.innerHTML = renderReview(); bindReview(view); scrollTracksToCurrent(); }
  else if (tab === 'picks') view.innerHTML = renderPicks();
  else if (tab === 'trades') view.innerHTML = renderTrades();
  else view.innerHTML = renderModes();
  $$('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
}
$$('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    if (btn.dataset.tab === tab) return;
    tab = btn.dataset.tab;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  });
});
$('#fab').addEventListener('click', function(){
  if (tab === 'picks') openPickSheet();
  else if (tab === 'trades') openTradeSheet();
  else if (tab === 'modes') openModeSheet();
});
render();

/* ============================================================
   Service Worker（PWA 缓存）
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('Service Worker 注册失败（不影响使用）', err);
    });
  });
}
</script>
