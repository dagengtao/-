function renderCompareCard(){
  if (!compareModeIds.length) return '';
  var modes = compareModeIds.map(function(id){ return S.modes.find(function(m){ return m.id === id; }); }).filter(Boolean);
  if (!modes.length) { compareModeIds = []; return ''; }

  var stats = modes.map(function(m){ return { mode: m, st: modeStats(m.id) }; });

  function bestIdx(metric, higherBetter){
    var vals = stats.map(function(s){ return s.st[metric]; });
    if (!vals.length) return -1;
    var bi = 0, bv = vals[0];
    for (var i = 1; i < vals.length; i++) {
      var v = vals[i];
      var curr = !isFinite(bv) ? (bv > 0 ? Number.MAX_VALUE : -Number.MAX_VALUE) : bv;
      var candidate = !isFinite(v) ? (v > 0 ? Number.MAX_VALUE : -Number.MAX_VALUE) : v;
      if (higherBetter ? candidate > curr : candidate < curr) { bi = i; bv = vals[i]; }
    }
    return bi;
  }

  var rows = [
    { label: '交易次数', key: 'n', fmt: function(v){ return v + ' 只'; }, hl: false },
    { label: '胜率', key: 'winRate', fmt: function(v){ return Math.round(v * 100) + '%'; }, hl: 'high' },
    { label: '累计盈亏', key: 'total', fmt: function(v){ return (v >= 0 ? '+' : '') + fmtNum(v); }, hl: 'high', color: true },
    { label: '最大回撤', key: 'maxDD', fmt: function(v){ return v < 0 ? fmtNum(v) : '—'; }, hl: 'low', color: 'down' },
    { label: '盈亏比', key: 'plRatio', fmt: function(v){ return fmtPLRatio(v); }, hl: 'high' },
    { label: '期望值/笔', key: 'expectancy', fmt: function(v){ return (v >= 0 ? '+' : '') + fmtNum(v); }, hl: 'high', color: true },
    { label: '平均持仓', key: 'avgHoldingDays', fmt: function(v){ return v.toFixed(1) + ' 天'; }, hl: false },
    { label: '最大连亏', key: 'maxConsecLosses', fmt: function(v){ return v + ' 次'; }, hl: 'low' }
  ];

  var header = '<tr><th>指标</th>' + stats.map(function(s, i){
    var cls = 'compare-color-' + ((i % 3) + 1);
    return '<th class="' + cls + '">' + esc(s.mode.name) + '</th>';
  }).join('') + '</tr>';

  var body = rows.map(function(row){
    var bi = row.hl ? bestIdx(row.key, row.hl === 'high') : -1;
    var cells = stats.map(function(s, i){
      var v = s.st[row.key];
      var text = row.fmt(v);
      var cls = '';
      if (row.color === true) cls = v >= 0 ? 'up' : 'down';
      else if (row.color === 'down') cls = v < 0 ? 'down' : '';
      var hl = (i === bi && stats.length > 1) ? ' best' : '';
      return '<td class="' + cls + hl + '">' + esc(text) + '</td>';
    }).join('');
    return '<tr><td>' + esc(row.label) + '</td>' + cells + '</tr>';
  }).join('');

  return '<div class="card">' +
    '<div class="card-title-row">' +
      '<div class="card-title">模式对比</div>' +
      '<button class="link-btn" onclick="clearCompare()">清空</button>' +
    '</div>' +
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px">' +
      '<table class="compare-table">' +
        '<thead>' + header + '</thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="foot-note" style="text-align:left;padding-top:10px">绿色 = 该指标表现最好（胜率/盈亏比/期望值高优先，回撤/连亏少优先）</div>' +
  '</div>';
}
window.clearCompare = function(){ compareModeIds = []; render(); };

/* ===== 模式卡片 ===== */
window.toggleModeExpand = function(id){
  expandedModes[id] = !expandedModes[id];
  render();
};

function renderModesOverview(){
  var st = calcGroupStats(function(){ return true; });
  var closedGroups = st.closedGroups || [];
  var cum = 0, curve = [0];
  closedGroups.forEach(function(g){ cum += g.realizedPnl; curve.push(cum); });

  return '<div class="card">' +
    '<div class="card-title">全部模式汇总</div>' +
    '<div class="mode-top">' +
      '<div class="mode-ring">' + winRateRing(st.winRate, st.n) + '</div>' +
      '<div class="mode-stats-list">' +
        '<div class="stat-row"><span class="stat-lbl">已清仓</span><span class="stat-num">' + st.n + ' 只</span></div>' +
        '<div class="stat-row"><span class="stat-lbl">累计盈亏</span><span class="stat-num ' + (st.total >= 0 ? 'up' : 'down') + '">' + (st.total >= 0 ? '+' : '') + fmtNum(st.total) + '</span></div>' +
        '<div class="stat-row"><span class="stat-lbl">最大回撤</span><span class="stat-num ' + (st.maxDD < 0 ? 'down' : '') + '">' + (st.maxDD < 0 ? fmtNum(st.maxDD) : '—') + '</span></div>' +
      '</div>' +
    '</div>' +
    (st.n >= 2 ?
      '<div class="chart-block">' +
        '<div class="chart-title"><span>资金曲线（叠加回撤阴影）</span><span class="legend">虚线 = 峰值 · 红底 = 回撤</span></div>' +
        sparklineBig(curve) +
      '</div>' +
      '<div class="chart-block">' +
        '<div class="chart-title"><span>胜率趋势</span><span class="legend">滚动窗口 · 虚线 = 50%</span></div>' +
        winRateTrend(closedGroups) +
      '</div>'
      : (st.n ? '<div class="chart-block"><div class="chart-title">资金曲线</div>' + sparklineBig(curve) + '</div>' : '')
    ) +
    renderAdvancedStats(st) +
  '</div>';
}

function renderModes(){
  var overview = renderModesOverview();

  var compareBar = '';
  if (S.modes.length >= 2) {
    compareBar = '<div class="card">' +
      '<div class="card-title-row">' +
        '<div class="card-title">多模式对比（选择 2-3 个）</div>' +
        (compareModeIds.length ? '<button class="link-btn" onclick="clearCompare()">清空</button>' : '') +
      '</div>' +
      S.modes.map(function(m){
        var st = modeStats(m.id);
        var checked = compareModeIds.indexOf(m.id) >= 0;
        return '<div class="compare-pick-row" onclick="toggleCompareMode(\'' + m.id + '\')">' +
          '<div class="compare-check' + (checked ? ' on' : '') + '">' + (checked ? '✓' : '') + '</div>' +
          '<div class="compare-pick-name">' + esc(m.name) + '</div>' +
          '<div class="compare-pick-n">' + st.n + ' 只</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  var compareCard = compareModeIds.length >= 2 ? renderCompareCard() : '';

  if (!S.modes.length) return overview + emptyState('还没有交易模式', '点击右下角 + 新建模式', 'mode');

  var list = S.modes.map(function(m){
    var st = modeStats(m.id);
    var envs = m.envs || [];
    var isExpanded = !!expandedModes[m.id];

    var header =
      '<div class="item-head">' +
        '<span class="stock-name">' + esc(m.name) + '</span>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-shrink:0">' +
          '<span class="badge ' + (st.n ? 'badge-blue' : 'badge-gray') + '">' + st.n + ' 只</span>' +
          '<svg class="mode-chevron' + (isExpanded ? ' open' : '') + '" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
      '</div>';

    var baseInfo =
      (envs.length ? '<div class="mode-envs">' + envs.map(function(e){ return '<span class="mode-env">' + esc(e) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="mode-top">' +
        '<div class="mode-ring">' + winRateRing(st.winRate, st.n) + '</div>' +
        '<div class="mode-stats-list">' +
          '<div class="stat-row"><span class="stat-lbl">已清仓</span><span class="stat-num">' + st.n + ' 只</span></div>' +
          '<div class="stat-row"><span class="stat-lbl">累计盈亏</span><span class="stat-num ' + (st.total >= 0 ? 'up' : 'down') + '">' + (st.total >= 0 ? '+' : '') + fmtNum(st.total) + '</span></div>' +
          '<div class="stat-row"><span class="stat-lbl">最大回撤</span><span class="stat-num ' + (st.maxDD < 0 ? 'down' : '') + '">' + (st.maxDD < 0 ? fmtNum(st.maxDD) : '—') + '</span></div>' +
        '</div>' +
      '</div>';

    var extended =
      '<div class="mode-extended">' +
        (st.n >= 2 ?
          '<div class="chart-block">' +
            '<div class="chart-title"><span>资金曲线</span><span class="legend">虚线 = 峰值 · 红底 = 回撤</span></div>' +
            sparklineBig(st.curve) +
          '</div>' +
          '<div class="chart-block">' +
            '<div class="chart-title"><span>胜率趋势</span><span class="legend">滚动窗口</span></div>' +
            winRateTrend(st.closedGroups || []) +
          '</div>'
          : (st.n ? '<div class="chart-label">资金曲线</div>' + sparklineBig(st.curve) : '')
        ) +
        (st.pnls.length ? '<div class="chart-label">每笔盈亏</div>' + pnlBars(st.pnls) : '') +
        renderEnvBreakdown(st.byEnv, envs) +
        renderAdvancedStats(st) +
        '<div class="mode-desc">' +
          '<div><b>逻辑</b>' + (esc(m.logic) || '—') + '</div>' +
          '<div><b>买点</b>' + (esc(m.buy) || '—') + '</div>' +
          '<div><b>卖点</b>' + (esc(m.sell) || '—') + '</div>' +
          '<div><b>止损</b>' + (esc(m.stop) || '—') + '</div>' +
        '</div>' +
        '<button class="btn-secondary" style="margin-top:14px" onclick="event.stopPropagation();openModeSheet(\'' + m.id + '\')">编辑模式</button>' +
      '</div>';

    return '<div class="card tap mode-card' + (isExpanded ? ' expanded' : '') + '" onclick="toggleModeExpand(\'' + m.id + '\')">' +
      header + baseInfo + extended +
    '</div>';
  }).join('');

  return overview + compareBar + compareCard + list;
}

var modeDraft = null;
window.openModeSheet = function(id){
  var ex = id ? S.modes.find(function(m){ return m.id === id; }) : null;
  modeDraft = ex ? JSON.parse(JSON.stringify(ex)) : { id:uid(), name:'', logic:'', buy:'', sell:'', stop:'', envs: [] };
  if (!Array.isArray(modeDraft.envs)) modeDraft.envs = [];
  drawModeSheet();
};
function drawModeSheet(){
  var m = modeDraft;
  var isNew = !S.modes.some(function(x){ return x.id === m.id; });
  openSheet(
    '<div class="sheet-title">' + (isNew ? '新建交易模式' : '编辑交易模式') + '</div>' +
    '<div class="frow"><label>名称</label><input id="m-name" value="' + esc(m.name) + '" placeholder="打板 / 低吸 / 半路…"></div>' +
    '<div class="sub-label" style="margin-top:14px">适用市场环境（仅用于标记）</div>' +
    (S.envOptions.length
      ? '<div class="seg" id="m-envs">' +
          S.envOptions.map(function(env){ return '<button type="button" data-env="' + esc(env.name).replace(/"/g,'&quot;') + '" class="' + ((m.envs||[]).indexOf(env.name) >= 0 ? 'on' : '') + '">' + esc(env.name) + '</button>'; }).join('') +
        '</div>'
      : '<div class="hint">还没有环境选项，请到「每日复盘」里添加</div>') +
    '<div class="block" style="margin-top:14px"><label>模式逻辑</label><textarea id="m-logic" rows="3">' + esc(m.logic) + '</textarea></div>' +
    '<div class="block"><label>买点</label><textarea id="m-buy" rows="2">' + esc(m.buy) + '</textarea></div>' +
    '<div class="block"><label>卖点</label><textarea id="m-sell" rows="2">' + esc(m.sell) + '</textarea></div>' +
    '<div class="block"><label>止损</label><textarea id="m-stop" rows="2">' + esc(m.stop) + '</textarea></div>' +
    '<button class="btn-primary" id="m-save">保存</button>' +
    (isNew ? '' : '<button class="btn-danger" id="m-del">删除</button>')
  );
  var map = { 'm-name':'name','m-logic':'logic','m-buy':'buy','m-sell':'sell','m-stop':'stop' };
  Object.keys(map).forEach(function(id){
    var el = $('#' + id);
    if (el) el.addEventListener('input', function(){ modeDraft[map[id]] = el.value; });
  });
  $$('#m-envs button', $('#sheet')).forEach(function(b){
    b.addEventListener('click', function(){
      var e = b.dataset.env;
      if (!modeDraft.envs) modeDraft.envs = [];
      var i = modeDraft.envs.indexOf(e);
      if (i >= 0) modeDraft.envs.splice(i, 1); else modeDraft.envs.push(e);
      b.classList.toggle('on');
    });
  });
  $('#m-save').onclick = function(){
    if (!modeDraft.name.trim()) return;
    var i = S.modes.findIndex(function(x){ return x.id === modeDraft.id; });
    if (i >= 0) S.modes[i] = modeDraft; else S.modes.push(modeDraft);
    save(); closeSheet(); render();
  };
  var del = $('#m-del');
  if (del) del.onclick = function(){
    var id = modeDraft.id;
    var affected = aggregateList(S.trades).filter(function(g){ return g.firstModeId === id; }).length;
    var msg = '确定删除这个模式？';
    if (affected > 0) msg += '\n\n有 ' + affected + ' 只股票的首笔买入记录关联此模式，删除后它们将显示为「模式外」。历史交易数据不会丢失。';
    if (!confirm(msg)) return;
    S.modes = S.modes.filter(function(x){ return x.id !== id; });
    var ci = compareModeIds.indexOf(id);
    if (ci >= 0) compareModeIds.splice(ci, 1);
    save(); closeSheet(); render();
  };
}

/* ===== 数据管理 ===== */
function openSettings(){
  var counts = {
    reviews: Object.keys(S.reviews).length,
    picks: S.picks.length,
    trades: S.trades.length,
    modes: S.modes.length,
    plans: Object.keys(S.plans || {}).length
  };
  var storage = getStorageStatus();
  var storageLabel = { ok: '正常', warn: '偏高', danger: '接近上限' }[storage.level];
  var storageAlert = '';
  if (storage.level === 'warn') {
    storageAlert = '<div class="storage-alert warn">存储空间已使用 ' + formatBytes(storage.size) + '（约 ' + Math.round(storage.pct*100) + '%）。建议导出备份后清理不必要的历史记录。</div>';
  } else if (storage.level === 'danger') {
    storageAlert = '<div class="storage-alert danger">存储空间接近上限（' + formatBytes(storage.size) + '，约 ' + Math.round(storage.pct*100) + '%）。请立即导出备份，否则下次保存可能失败。</div>';
  }
  openSheet(
    '<div class="sheet-title">数据管理</div>' +
    '<div class="sheet-desc">数据保存在本机浏览器。换设备或清理缓存前，请先导出备份。</div>' +
    '<div class="foot-note" style="text-align:left;padding:8px 0 4px;line-height:1.8">' +
      '当前数据量：<br>' +
      '· 每日复盘 ' + counts.reviews + ' 天<br>' +
      '· 每日计划 ' + counts.plans + ' 天<br>' +
      '· 选股记录 ' + counts.picks + ' 条<br>' +
      '· 交易记录 ' + counts.trades + ' 笔<br>' +
      '· 交易模式 ' + counts.modes + ' 个<br>' +
      '· 环境选项 ' + (S.envOptions || []).length + ' 个<br>' +
      '· 数据版本 v' + (S.dataVersion || CURRENT_VERSION) +
    '</div>' +
    '<div style="margin-top:12px">' +
      '<div class="storage-text"><span>本地存储占用</span><span>' + formatBytes(storage.size) + ' / 约 5 MB · ' + storageLabel + '</span></div>' +
      '<div class="storage-bar"><div class="storage-fill ' + storage.level + '" style="width:' + Math.min(100, storage.pct * 100).toFixed(1) + '%"></div></div>' +
    '</div>' +
    storageAlert +
    '<button class="btn-primary" id="btn-export">导出数据（JSON 文件）</button>' +
    '<button class="btn-secondary" id="btn-import">导入数据</button>' +
    '<button class="btn-danger" id="btn-reset">清空所有数据</button>'
  );
  $('#btn-export').onclick = exportData;
  $('#btn-import').onclick = importData;
  $('#btn-reset').onclick = resetData;
}
function exportData(){
  try {
    var json = JSON.stringify(S, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '复盘数据_v' + (S.dataVersion || CURRENT_VERSION) + '_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    flashSaved();
    closeSheet();
  } catch(e) {
    alert('导出失败：' + (e.message || e));
  }
}
function importData(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var data;
      try { data = JSON.parse(ev.target.result); }
      catch(err) { alert('文件不是有效的 JSON 格式'); return; }
      var errors = validateImportData(data);
      if (errors.length) {
        alert('导入文件校验失败：\n\n· ' + errors.slice(0, 6).join('\n· ') + (errors.length > 6 ? '\n· 还有 ' + (errors.length - 6) + ' 项…' : ''));
        return;
      }
      if (!confirm('导入将覆盖当前所有数据，确定吗？')) return;
      try {
        data = migrate(data);
        S = data;
        save();
        closeSheet();
        render();
        alert('导入成功');
      } catch(err) {
        alert('导入失败：' + (err.message || err));
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetData(){
  if (!confirm('确定清空所有数据？')) return;
  if (!confirm('再次确认：所有数据都会被删除，且无法恢复。')) return;
  S = freshState();
  save();
  closeSheet();
  render();
  alert('已清空');
}
$('#settingsBtn').addEventListener('click', openSettings);

/* ===== 通用 UI ===== */
function emptyState(title, sub, iconType){
  var icon = '';
  var baseStyle = 'width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="empty-icon"';
  if (iconType === 'trade') icon = '<svg ' + baseStyle + '><path d="M4 7h11l-3-3"/><path d="M20 17H9l3 3"/><path d="M4 12h16"/></svg>';
  else if (iconType === 'pick') icon = '<svg ' + baseStyle + '><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/><path d="M11 8v6M8 11h6"/></svg>';
  else if (iconType === 'mode') icon = '<svg ' + baseStyle + '><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>';
  else if (iconType === 'plan') icon = '<svg ' + baseStyle + '><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
  return '<div class="empty">' + icon +
    '<div class="empty-title">' + esc(title) + '</div>' +
    '<div class="empty-sub">' + esc(sub) + '</div>' +
  '</div>';
}
function openSheet(html){
  var sh = $('#sheet');
  sh.innerHTML = '<div class="handle"></div>' + html;
  sh.scrollTop = 0;
  requestAnimationFrame(function(){
    sh.classList.add('open');
    $('#backdrop').classList.add('open');
  });
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  $('#backdrop').classList.remove('open');
}
$('#backdrop').addEventListener('click', closeSheet);

$('#fatalReload').addEventListener('click', function(){ location.reload(); });
$('#fatalExport').addEventListener('click', function(){
  try {
    var json = JSON.stringify(S, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '复盘数据_紧急备份_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e) { alert('导出失败：' + e.message); }
});

/* ===== 主渲染 ===== */
var tab = 'review';
var TITLES = { review:'每日复盘', picks:'选股', trades:'交易复盘', modes:'交易模式' };
function render(){
  var view = $('#view');
  $('#pageTitle').textContent = TITLES[tab];
  var sub = '';
  if (tab === 'review') sub = curDate;
  else if (tab === 'picks') sub = '共 ' + S.picks.length + ' 条记录';
  else if (tab === 'trades') sub = '共 ' + S.trades.length + ' 笔操作';
  else sub = '共 ' + S.modes.length + ' 个模式';
  $('#pageSub').textContent = sub;
  $('#fab').hidden = (tab === 'review');
  if (tab === 'review') { view.innerHTML = renderReview(); bindReview(view); }
  else if (tab === 'picks') view.innerHTML = renderPicks();
  else if (tab === 'trades') view.innerHTML = renderTrades();
  else view.innerHTML = renderModes();
  $$('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
}
$$('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    if (btn.dataset.tab === tab) return;
    tab = btn.dataset.tab;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  });
});
$('#fab').addEventListener('click', function(){
  if (tab === 'picks') openPickSheet();
  else if (tab === 'trades') openTradeSheet();
  else if (tab === 'modes') openModeSheet();
});
render();

/* ===== Service Worker ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('Service Worker 注册失败（不影响使用）', err);
    });
  });
}
